appId: com.pi.desktop
productName: Pi Desktop
copyright: Copyright © Pi Desktop
directories:
  buildResources: build
  output: release
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!tests/*'
  - '!_ev-scaffold2/*'
  - '!.superpowers/*'
  - '!docs/*'
  - '!scripts/*'
  - '!release/*'
  - '!**/*.{md,map}'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.*.tsbuildinfo}'
  # Renderer-only packages are already bundled into out/ — exclude to cut size hard
  - '!node_modules/monaco-editor/**'
  - '!node_modules/naive-ui/**'
  - '!node_modules/@vicons/**'
  - '!node_modules/vue/**'
  - '!node_modules/pinia/**'
  - '!node_modules/splitpanes/**'
  - '!node_modules/sortablejs/**'
  - '!node_modules/@types/**'
  - '!node_modules/xterm/**'
  - '!node_modules/@xterm/**'
  - '!node_modules/xterm-addon-web-links/**'
  - '!node_modules/mermaid/**'
  - '!node_modules/katex/**'
  - '!node_modules/marked-katex-extension/**'
  - '!node_modules/@viz-js/**'
  - '!node_modules/dayjs/**'
  - '!node_modules/cytoscape/**'
  - '!node_modules/cytoscape-*/**'
  - '!node_modules/khroma/**'
  - '!node_modules/d3*/**'
  - '!node_modules/dagre*/**'
  - '!node_modules/roughjs/**'
  - '!node_modules/stylis/**'
  # Keep marked + highlight.js: Pi SDK (agent-worker) requires them at runtime.
  - '!node_modules/dompurify/**'
  - '!node_modules/csstype/**'
  - '!node_modules/seemly/**'
  - '!node_modules/vooks/**'
  - '!node_modules/vueuc/**'
  - '!node_modules/@juggle/**'
  - '!node_modules/@css-render/**'
  - '!node_modules/css-render/**'
  - '!node_modules/evtd/**'
  - '!node_modules/treemate/**'
  - '!node_modules/date-fns-tz/**'
  - '!node_modules/date-fns/**'
  - '!**/node_modules/*/{CHANGELOG*,README*,readme*,License,LICENSE,LICENCE,*.d.ts}'
  - '!**/node_modules/*/{test,tests,__tests__,example,examples,doc,docs,coverage,.github}/**'
  - '!**/node_modules/.bin/**'
asarUnpack:
  - '**/*.node'
  # dugite embeds a real Git binary (win/mac/linux); must stay outside asar.
  # dugite rewrites app.asar → app.asar.unpacked when resolving git/.
  - '**/node_modules/dugite/git/**'
extraResources:
  - from: resources/
    to: resources/
    filter:
      - '**/*'
icon: build/icon.png
compression: normal
removePackageScripts: true
nodeGypRebuild: false
# Rebuild native addons (node-pty) for the current --arch only.
npmRebuild: true
buildDependenciesFromSource: false
electronLanguages:
  - en-US
  - zh-CN

# One NSIS installer per arch (build with --x64 OR --arm64, never both in one fat package).
win:
  executableName: PiDesktop
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}
  target:
    - target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Pi Desktop
  uninstallDisplayName: Pi Desktop
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}
  differentialPackage: false

mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  target:
    - target: dmg
  extendInfo:
    NSCameraUsageDescription: Pi Desktop may use the camera for browser previews.
    NSMicrophoneUsageDescription: Pi Desktop uses the microphone for local speech recognition and browser previews.
    NSAppleEventsUsageDescription: Pi Desktop may control Terminal to help install the Pi CLI when needed.
    NSDocumentsFolderUsageDescription: Pi Desktop needs access to your Documents folder for workspaces.
    NSDownloadsFolderUsageDescription: Pi Desktop needs access to your Downloads folder for workspaces.
    NSDesktopFolderUsageDescription: Pi Desktop needs access to your Desktop folder for workspaces.
    NSRemovableVolumesUsageDescription: Pi Desktop needs access to removable volumes when you open a workspace there.
    NSNetworkVolumesUsageDescription: Pi Desktop needs access to network volumes when you open a workspace there.
  # Requires Apple Developer ID + notary credentials in CI to enable.
  notarize: false

dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  writeUpdateInfo: false

linux:
  target:
    - AppImage
  category: Development
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

publish:
  provider: github
  releaseType: release
