appId: com.pi.desktop
productName: Pi Desktop
copyright: Copyright © Pi Desktop
directories:
  buildResources: build
  output: release
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!tests/*'
  - '!_ev-scaffold2/*'
  - '!.superpowers/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.*.tsbuildinfo}'
  - '!scripts/*'
  - '!**/*.md'
asarUnpack:
  - 'resources/**'
  - '**/*.node'
extraResources:
  - from: resources/
    to: resources/
    filter:
      - '**/*'
icon: build/icon.png

# Electron 39+ does not ship Windows ia32 (32-bit). Targets: win x64 + arm64, mac x64 + arm64.
win:
  executableName: PiDesktop
  artifactName: ${productName}-${version}-win-${arch}.${ext}
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Pi Desktop
  uninstallDisplayName: Pi Desktop
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}

mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  extendInfo:
    NSCameraUsageDescription: Pi Desktop may use the camera for browser previews.
    NSMicrophoneUsageDescription: Pi Desktop may use the microphone for browser previews.
    NSDocumentsFolderUsageDescription: Pi Desktop needs access to your Documents folder for workspaces.
    NSDownloadsFolderUsageDescription: Pi Desktop needs access to your Downloads folder for workspaces.
  notarize: false

dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

linux:
  target:
    - AppImage
  category: Development
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

npmRebuild: true
electronLanguages:
  - en-US
  - zh-CN

publish:
  provider: github
  releaseType: release
