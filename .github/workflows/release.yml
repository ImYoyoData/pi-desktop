# Release packaging + GitHub Release: ONLY on push to main (or manual dispatch).
# Tags and `dev` must NOT trigger this workflow. Use ci.yml for PR/dev checks.
name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish GitHub Release artifacts"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            build_cmd: npm run dist:win
          - name: macos
            os: macos-latest
            build_cmd: npm run dist:mac

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate icons
        run: npm run icons

      - name: Typecheck & unit tests
        run: |
          npm run typecheck
          npm test

      - name: Build & package
        env:
          # Prevent electron-builder from creating/updating GitHub Releases mid-build
          # (publish is handled solely by the softprops job below).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: ${{ matrix.build_cmd }} -- --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pi-desktop-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.yml
            release/*.yaml
            release/*.blockmap
          if-no-files-found: warn
          retention-days: 14

  release:
    name: GitHub Release
    needs: build
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p upload
          find dist-artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.blockmap' -o -name '*.yml' -o -name '*.yaml' \) -print -exec cp {} upload/ \;
          ls -lah upload || true

      - name: Read version
        id: ver
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Pi Desktop ${{ steps.ver.outputs.tag }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: upload/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
