# Release packaging + GitHub Release: ONLY on push to main (or manual dispatch).
# Tags and `dev` must NOT trigger this workflow. Use ci.yml for PR/dev checks.
#
# One job = one OS/arch installer (never fat / multi-arch packages).
name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish GitHub Release artifacts"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  # Never cancel an in-flight release — previous runs were aborted mid macOS build
  # when a follow-up push to main arrived (cancel-in-progress: true).
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build (${{ matrix.name }})
    needs: check
    runs-on: ${{ matrix.os }}
    # Fail fast instead of sitting in a scarce-runner void for hours.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            dugite_arch: x64
            build_cmd: npm run dist:win:x64
            artifact_glob: release/*-setup.exe
          - name: windows-arm64
            # Separate job → separate NSIS (not a fat installer). Cross-arch Electron + node-pty prebuilds.
            os: windows-latest
            dugite_arch: arm64
            build_cmd: npm run dist:win:arm64
            artifact_glob: release/*-setup.exe
          - name: macos-arm64
            os: macos-latest
            dugite_arch: arm64
            build_cmd: npm run dist:mac:arm64
            artifact_glob: release/*.dmg
          - name: macos-x64
            # Intel DMG on Apple Silicon runners. Avoid macos-13 (scarce / long queue).
            # dist:mac:x64 rebuilds node-pty for x64 then packages with npmRebuild=false
            # (cross-arch electron-builder rebuild often SIGABRT / exit 134).
            os: macos-latest
            dugite_arch: x64
            build_cmd: npm run dist:mac:x64
            artifact_glob: release/*.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # dugite postinstall fetches host-arch Git; cross-arch jobs must refresh before pack.
      - name: Ensure dugite embedded Git (${{ matrix.dugite_arch }})
        run: node scripts/ensure-dugite-git.mjs ${{ matrix.dugite_arch }}

      - name: Generate icons
        run: npm run icons

      - name: Build & package
        env:
          # Prevent electron-builder from creating/updating GitHub Releases mid-build
          # (publish is handled solely by the softprops job below).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip Apple identity discovery — unsigned builds; avoids notarize/signing hangs.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Monaco / Vite can OOM-abort (exit 134) on macOS runners without a larger heap.
          NODE_OPTIONS: --max-old-space-size=8192
        run: ${{ matrix.build_cmd }} -- --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pi-desktop-${{ matrix.name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: [check, build]
    # Publish whatever arch artifacts succeeded (don't block the whole release on one matrix cell).
    if: >
      always() &&
      needs.check.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p upload
          find dist-artifacts -type f \( -name '*-setup.exe' -o -name '*.dmg' -o -name '*.AppImage' \) -print -exec cp {} upload/ \;
          echo "=== release assets ==="
          ls -lah upload || true
          count=$(find upload -type f | wc -l | tr -d ' ')
          if [ "$count" -lt 1 ]; then
            echo "No release assets found" >&2
            exit 1
          fi

      - name: Read version
        id: ver
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Pi Desktop ${{ steps.ver.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 主要更新（0.1.9 正式版）

            本轮聚焦：聊天体验、Git 稳定性与面板重构、全局 UI 打磨与性能。会话继续与 Pi CLI 共享（`~/.pi/agent/sessions`）。

            ### 聊天体验
            - 会话/回合完成后执行过程全部折叠（工具卡片、思考块、工具组），只突出用户问题与最终答复——即使会话状态异常也会折叠
            - 并行编辑多文件独立卡片；工具完成后自动折叠
            - Codex 风格布局：居中阅读列、用户消息右对齐气泡
            - 待发送队列「引导提交」：运行中发送不打断模型，作为引导排队处理（支持图片）

            ### 启动与过渡
            - 新增启动过渡动画：Logo + 进度条遮罩，应用就绪后淡出，隐藏所有加载状态
            - 最小化/恢复不再卡顿（隐藏时暂停 IPC 冲刷）

            ### Git
            - 分支管理完善：删除/重命名分支、文件历史、单提交 diff、还原到指定版本
            - 提交区重构：底部多行输入、Enter 提交、提交并推送
            - 串行化 git 子进程消除 index.lock 竞争；网络操作独立 10 分钟超时
            - Changes 面板 GitHub Desktop 风格重构：状态徽章、双行文件行、卡片式提交区

            ### 全局 UI
            - 设置弹窗统一卡片式分区
            - 扩展市场卡片网格展示
            - 待办列表新增进度条

            ### 性能
            - 会话/工作区切换缓存优化；流式滚动合并；工具卡片解析缓存

            ## What's New (0.1.9 stable)

            Chat UX, Git stability & redesigned Changes panel, startup transition, and global UI polish. Sessions stay **shared with Pi CLI**.

            ### Chat
            - All process rows (tools, thinking, groups) fold after a round completes - even if session status is stuck
            - Steer send from the queue no longer interrupts the running model (images supported)
            - Codex-style layout: centered column, right-aligned user bubbles

            ### Startup & Transitions
            - New startup splash (logo + progress) fades out once the app is ready, hiding loading states
            - Restoring from minimized is smooth (IPC flushing paused while hidden)

            ### Git
            - Full branch management: rename / delete branches
            - File history with per-commit diff and restore-to-version
            - Redesigned Changes panel (GitHub Desktop style): status badges, two-line file rows, bottom commit card
            - Commit & push in one click; Enter to commit
            - Git subprocesses serialized (no more index.lock races); 10-minute network timeout

            ### UI Polish
            - Settings modals use unified section cards
            - Extension market rendered as a responsive card grid
            - Todo panel gets a progress bar

            ### Performance
            - Cached session listings; coalesced stream scrolling; memoized tool card parsing

            ## 下载 / Downloads
            - **Windows x64**: `Pi Desktop-*-win-x64-setup.exe`
            - **Windows ARM64**: `Pi Desktop-*-win-arm64-setup.exe`
            - **macOS Apple Silicon**: `Pi Desktop-*-mac-arm64.dmg`
            - **macOS Intel**: `Pi Desktop-*-mac-x64.dmg`

            ## 说明 / Notes
            - 本版本为**正式稳定版**（非 prerelease）
            - macOS 未公证：首次打开可能需要右键 → 打开
            - This is a **stable** release
            - macOS is unsigned/notarization off — first open may need right-click → Open
          files: upload/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
