#file: noinspection UndefinedParamsPresent
# Release packaging + GitHub Release: ONLY on push to main (or manual dispatch).
# Tags and `dev` must NOT trigger this workflow. Use ci.yml for PR/dev checks.
#
# One job = one OS/arch installer (never fat / multi-arch packages).
name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish GitHub Release artifacts"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  # Never cancel an in-flight release — previous runs were aborted mid macOS build
  # when a follow-up push to main arrived (cancel-in-progress: true).
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  version:
    name: Check version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.v.outputs.changed }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # 同一版本号只发布一次：tag 已存在就跳过整条发布链；手动 dispatch 时强制重发。
      - name: Detect version tag
        id: v
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REF="repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG"
          if STATUS=$(gh api "$REF" 2>&1 >/dev/null); then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [[ "$STATUS" == *"HTTP 404"* ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag lookup failed: $STATUS" >&2
            exit 1
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: [check, version]
    if: needs.version.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    # Fail fast instead of sitting in a scarce-runner void for hours.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            dugite_arch: x64
            build_cmd: npm run dist:win:x64
            artifact_glob: release/*-setup.exe
          - name: windows-arm64
            # Separate job → separate NSIS (not a fat installer). Cross-arch Electron + node-pty prebuilds.
            os: windows-latest
            dugite_arch: arm64
            build_cmd: npm run dist:win:arm64
            artifact_glob: release/*-setup.exe
          - name: macos-arm64
            os: macos-latest
            dugite_arch: arm64
            build_cmd: npm run dist:mac:arm64
            artifact_glob: release/*.dmg
          - name: macos-x64
            # Intel DMG on Apple Silicon runners. Avoid macos-13 (scarce / long queue).
            # dist:mac:x64 rebuilds node-pty for x64 then packages with npmRebuild=false
            # (cross-arch electron-builder rebuild often SIGABRT / exit 134).
            os: macos-latest
            dugite_arch: x64
            build_cmd: npm run dist:mac:x64
            artifact_glob: release/*.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # dugite post install fetches host-arch Git; cross-arch jobs must refresh before pack.
      - name: Ensure dugite embedded Git (${{ matrix.dugite_arch }})
        run: node scripts/ensure-dugite-git.mjs ${{ matrix.dugite_arch }}

      - name: Generate icons
        run: npm run icons

      - name: Build & package
        env:
          # Prevent electron-builder from creating/updating GitHub Releases mid-build
          # (publish is handled solely by the softprops job below).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip Apple identity discovery — unsigned builds; avoids notarize/signing hangs.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Monaco / Vite can OOM-abort (exit 134) on macOS runners without a larger heap.
          NODE_OPTIONS: --max-old-space-size=8192
        # --publish never 由各 dist 脚本自带；此处追加 `-- --publish never` 会被 npm
        # 附到脚本末尾，落到嵌套的 npm run 上并作为未知 CLI 配置直接报错。
        run: ${{ matrix.build_cmd }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pi-desktop-${{ matrix.name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: [check, version, build]
    # Publish whatever arch artifacts succeeded (don't block the whole release on one matrix cell).
    if: >
      always() &&
      needs.check.result == 'success' &&
      needs.version.outputs.changed == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p upload
          find dist-artifacts -type f \( -name '*-setup.exe' -o -name '*.dmg' -o -name '*.AppImage' \) -print -exec cp {} upload/ \;
          echo "=== release assets ==="
          ls -lah upload || true
          count=$(find upload -type f | wc -l | tr -d ' ')
          if [ "$count" -lt 1 ]; then
            echo "No release assets found" >&2
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Pi Desktop ${{ needs.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |

            ## 主要更新（v0.3.5-rc.2）

            本版重点：修复 pi 0.87 升级后插件工具在 Agent 会话与设置-工具页全部
            消失的问题；此外重做了工具调用的折叠体验（默认折叠 + 分类次数小结）、
            修好了 Windows 上的 bash 工具，并大幅改善了「停止」时的卡顿。

            ### 新功能 Features

            - **工具调用默认折叠 + 设置开关**：读取/写入文件、执行命令等工具卡片默认
              **全部折叠**，长回合不再被 diff 和文件内容淹没。设置 → 外观新增
              「展开工具调用详情」开关，打开后恢复原来的行为（写入/编辑/命令/清单
              在流式时自动展开，读取始终折叠）。
            - **折叠后显示分类次数小结**：折叠起来的过程行汇总成一行，例如
              「查看了 2 个文件 · 执行了 1 条命令 · 更新了 1 次清单」，明确告诉你这一轮
              做了什么、各做了几次，而不是只挑一个文件名。
            - **进行中显示当前所有操作**：回合还在跑时标题显示**所有正在进行的步骤**
              （并行操作并列展示，各占一段），收尾后自动换成上面的分类小结 ——
              运行中能看清"现在在干嘛"，结束后只留结论。
            - **引导内容不再"消失"**：回复期间发送的内容，之前会有一段时间在界面上
              完全看不到（引导是立即注入的，但 Pi 要等当前工具调用跑完才把它写进会话
              记录）。现在发送后立刻显示为「引导中」卡片，直到真正出现在聊天记录里。
            - **「回答语言」设置**：设置 → 外观可为 Pi 的回复指定语言（20 种，默认
              「跟随设备」按系统语言判断），与界面语言相互独立 —— 界面英文而 Pi 用中文
              回答是可以的。语言写入系统提示词，避免模型跟着上一条消息的语言漂移。

            - **Tool calls collapsed by default, with a toggle**: file reads/writes
              and command cards now start folded, so a long turn is no longer buried
              under diffs and file dumps. Settings → Appearance gains an "Expand
              tool call details" switch that restores the previous per-kind
              behaviour (write/edit/bash/todo expand while streaming, reads stay
              folded).
            - **Per-category counts in the folded summary**: a folded process section
              now reads like "Reviewed 2 files · Ran 1 command · Updated todos 1
              time" — what happened and how many times, instead of naming a single
              file.
            - **Live view of everything in flight**: while a turn runs, the header
              lists every step currently running (parallel steps each get their own
              segment), then swaps to the count summary once it settles.
            - **Guidance no longer appears to vanish**: text sent while Pi was
              replying used to be invisible for a while (steering is injected
              immediately, but Pi only writes it into the session after the current
              tool calls finish). It now shows as a "Guiding" card from the moment
              it is sent until it lands in the transcript.
            - **Answer language setting**: Settings → Appearance lets you pin the
              language Pi replies in (20 options, defaulting to "follow the
              device"). Independent of the interface language, and written into the
              system prompt so the model does not drift into whatever language the
              last message used.

            ### 变更 Changes

            - **标题栏改为半透明**：顶栏颜色改为 74% 不透明并加毛玻璃模糊，启用壁纸时
              透出壁纸、未启用时透出窗口底色，不再是实心色块；拖动窗口的行为不受影响。
            - **输入框与聊天区域同宽**：输入框去掉了自己独立的 748px 宽度上限，改为与
              消息内容共用同一个列盒子（同一个「消息宽度」设置 + 同样的内边距），左边缘
              严格对齐；`ask_user` 卡片、权限弹窗、扩展 UI 也一并统一。拖动「消息宽度」
              时输入框会跟着一起变。消息列表同时固定预留滚动条槽位，避免滚动条出现/
              消失时整列左右跳动。

            - **Semi-transparent title bar**: the bar is now 74% opaque with a
              backdrop blur, showing the wallpaper through it when one is set (and
              the window backing colour otherwise) instead of a solid block.
            - **Composer now matches the chat column width**: the input no longer has
              its own 748px cap and instead shares the message content's column box
              (same "message width" setting and the same padding), so the left edges
              line up exactly. The ask_user card, permission dialog and extension UI
              were unified the same way. The message list also reserves its
              scrollbar gutter so the column no longer shifts when a scrollbar
              appears.

            ### 修复 Fixes

            - **修复插件工具在 Agent 会话与设置-工具页全部消失**：pi 0.87 的扩展加载器
              改为按 `usesEmbeddedModules` 三分支选择解析方式，构建期 Electron 补丁的
              正则不再匹配，打包产物回落到 `getAliases()`；CJS 下 `import.meta.resolve`
              退化为 `require.resolve`，而 Pi 各包是 ESM-only（exports 只有 `import`
              条件），解析必然抛 `ERR_PACKAGE_PATH_NOT_EXPORTED`，所有扩展加载失败。
              现将兜底分支替换为 `virtualModules`，扩展改用产物内已打包的模块解析，
              插件工具在会话与设置页恢复。

            - **Fixed plugin tools vanishing from Agent sessions and Settings →
              Tools**: pi 0.87's extension loader now picks its resolution strategy
              through a three-branch `usesEmbeddedModules`, so the build-time
              Electron patch regex no longer matched and the bundle fell back to
              `getAliases()`. Under CJS `import.meta.resolve` degrades to
              `require.resolve`, and since the Pi packages are ESM-only (exports
              expose only the `import` condition) this always throws
              `ERR_PACKAGE_PATH_NOT_EXPORTED`, failing every extension load. The
              fallback branch is now replaced with `virtualModules`, resolving
              extensions against the modules already bundled into the output,
              restoring plugin tools in sessions and Settings.

            - **修复 Windows 上 bash 工具不可用**（`execvpe(/bin/bash) failed:
              No such file or directory`）：工具原本退回到 PATH 上的 `bash.exe`，而那
              其实是 WSL 启动器，未安装 WSL 发行版时必然失败。现在会从 PATH 上的
              `git` 反推真正的 bash（Git 装在 D 盘、`%ProgramFiles%` 在 C 盘这种情况
              也能找到），找不到才改用内置 PowerShell 工具，并禁止调用不可用的 bash，
              避免模型反复撞错。
            - **修复点「停止」时的卡顿与假死**：停止是一次等待 worker 回应的 RPC，而
              force-kill 兜底时限原本是 **30 秒** —— worker 若正忙于同步的工具调用或
              大文件写盘，界面就会一直没有任何反馈，看起来像卡死。现在兜底降到 8 秒，
              并且点击瞬间按钮就变成「正在停止…」的加载态。
            - **修复「新建会话」不输入内容仍会残留空会话文件**：点「新建会话」会预热
              一个会话（界面立刻可用、不落侧栏），但退出时只清理了"已激活但未使用"的
              会话，**预热草稿**那条路径没有释放，于是磁盘上留下一个永远不出现在侧栏的
              空 jsonl。现在退出时会同时释放预热草稿与未使用的会话。
            - **修复权限弹窗比输入框宽**：权限卡、ask_user 卡与扩展 UI 之前不跟随聊天列
              宽度，会横跨整个面板；现在与输入框使用同一列几何。

            - **Fixed the bash tool being unusable on Windows**
              (`execvpe(/bin/bash) failed: No such file or directory`): its shell
              fallback picked `bash.exe` from PATH, which is the WSL launcher and
              fails whenever no WSL distribution is installed. A real bash is now
              derived from the `git` found on PATH — which also covers Git installed
              on a different drive than `%ProgramFiles%` — and only when none exists
              does the app switch to the built-in PowerShell tool and deny the broken
              `bash` tool.
            - **Fixed the stall and dead-feeling UI when pressing Stop**: stopping is
              an RPC that waits for the worker, and the force-kill fallback was
              **30 seconds** — if the worker was busy in a synchronous tool call or a
              large session write, the UI showed nothing for the whole wait. The
              fallback is now 8 seconds, and the button switches to a "Stopping…"
              spinner the moment it is clicked.
            - **Fixed abandoned "new session" drafts leaving an empty session file on
              disk**: clicking 新建会话 pre-warms a session (usable immediately, never
              shown in the sidebar), but quit-time cleanup only handled the
              active-but-unused case and never released the *prepared draft*, so an
              empty jsonl stayed on disk while being hidden from the sidebar. Quit now
              releases both; verified that new session → type nothing → quit leaves no
              file behind.
            - **Fixed the permission dialog being wider than the input box**: the
              permission card, ask_user card and extension UI did not follow the chat
              column and spanned the whole panel; they now share the composer's
              column geometry.

            ### 优化 / 体验 Improvements

            - **折叠/展开更顺滑**：按分段内容体量决定是否做动画，超大分段的折叠改为瞬时
              切换，避免逐帧重排海量节点造成卡顿。
            - **输入框跟随「消息宽度」设置**：调整消息宽度时输入框同步变化，两者不会再
              脱节；消息列固定预留滚动条槽位，列宽不再随内容长短跳动。

            - **Smoother folding**: whether a fold animates is decided by the
              section's content size, and oversized sections snap instead of
              re-laying out thousands of nodes every frame.
            - **The composer follows the message-width setting** and the chat column
              reserves its scrollbar gutter, so the two never drift apart and the
              column width no longer jumps with content length.

            ## 下载 / Downloads
            - **Windows x64**: `Pi Desktop-*-win-x64-setup.exe`
            - **Windows ARM64**: `Pi Desktop-*-win-arm64-setup.exe`
            - **macOS Apple Silicon**: `Pi Desktop-*-mac-arm64.dmg`
            - **macOS Intel**: `Pi Desktop-*-mac-x64.dmg`

          files: upload/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
