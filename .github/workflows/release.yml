# Release packaging + GitHub Release: ONLY on push to main (or manual dispatch).
# Tags and `dev` must NOT trigger this workflow. Use ci.yml for PR/dev checks.
#
# One job = one OS/arch installer (never fat / multi-arch packages).
name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish GitHub Release artifacts"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  # Never cancel an in-flight release — previous runs were aborted mid macOS build
  # when a follow-up push to main arrived (cancel-in-progress: true).
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build (${{ matrix.name }})
    needs: check
    runs-on: ${{ matrix.os }}
    # Fail fast instead of sitting in a scarce-runner void for hours.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            dugite_arch: x64
            build_cmd: npm run dist:win:x64
            artifact_glob: release/*-setup.exe
          - name: windows-arm64
            # Separate job → separate NSIS (not a fat installer). Cross-arch Electron + node-pty prebuilds.
            os: windows-latest
            dugite_arch: arm64
            build_cmd: npm run dist:win:arm64
            artifact_glob: release/*-setup.exe
          - name: macos-arm64
            os: macos-latest
            dugite_arch: arm64
            build_cmd: npm run dist:mac:arm64
            artifact_glob: release/*.dmg
          - name: macos-x64
            # Intel DMG on Apple Silicon runners. Avoid macos-13 (scarce / long queue).
            # dist:mac:x64 rebuilds node-pty for x64 then packages with npmRebuild=false
            # (cross-arch electron-builder rebuild often SIGABRT / exit 134).
            os: macos-latest
            dugite_arch: x64
            build_cmd: npm run dist:mac:x64
            artifact_glob: release/*.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # dugite postinstall fetches host-arch Git; cross-arch jobs must refresh before pack.
      - name: Ensure dugite embedded Git (${{ matrix.dugite_arch }})
        run: node scripts/ensure-dugite-git.mjs ${{ matrix.dugite_arch }}

      - name: Generate icons
        run: npm run icons

      - name: Build & package
        env:
          # Prevent electron-builder from creating/updating GitHub Releases mid-build
          # (publish is handled solely by the softprops job below).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip Apple identity discovery — unsigned builds; avoids notarize/signing hangs.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Monaco / Vite can OOM-abort (exit 134) on macOS runners without a larger heap.
          NODE_OPTIONS: --max-old-space-size=8192
        run: ${{ matrix.build_cmd }} -- --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pi-desktop-${{ matrix.name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: [check, build]
    # Publish whatever arch artifacts succeeded (don't block the whole release on one matrix cell).
    if: >
      always() &&
      needs.check.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p upload
          find dist-artifacts -type f \( -name '*-setup.exe' -o -name '*.dmg' -o -name '*.AppImage' \) -print -exec cp {} upload/ \;
          echo "=== release assets ==="
          ls -lah upload || true
          count=$(find upload -type f | wc -l | tr -d ' ')
          if [ "$count" -lt 1 ]; then
            echo "No release assets found" >&2
            exit 1
          fi

      - name: Read version
        id: ver
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Pi Desktop ${{ steps.ver.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |

            ## 主要更新（0.2.1 正式版）

            本版聚焦：云端 ASR（含小米 MiMo 自动适配）、语音识别修复、会话信息面板、聊天与 Git 面板打磨、启动提速与打包加速。

            ### 语音识别 ASR
            - 云端 ASR：首次使用选择弹窗、本地/云端 Tab、接口格式自动适配（小米 MiMo 走 chat/completions + input_audio，中文默认 language=zh）、录制音频自动上传
            - 修复识别混乱：录音被二次降采样压缩 3 倍，现按 16kHz→16kHz 编码并升级为线性插值降采样
            - 空转录不再报错，显示「未识别到语音」；语音设置弹窗全新卡片布局
            - 启动蒙版等待扩展/Skills 加载完成后再淡出（新流体动画 + 过渡）

            ### 会话与聊天
            - 会话信息按钮：查看该会话加载的工具、扩展、Skills 与读取的文件
            - 过程折叠条展开后可随时再折叠；会话结束后历史只显示用户消息+折叠条+结论
            - 重试按钮改为静默继续（不再追加「继续」气泡）
            - 修复 agent 运行命令时界面卡顿（流式输出显示级截断）
            - 图片粘贴融合进图片（不再额外 tag）、删除时清理缓存、右键复制/另存、切换会话图片与标签还原

            ### Git 与文件
            - 文件暂存/取消暂存、提交历史查看文件列表、软/硬重置、单文件 diff 与恢复
            - 右键过滤文件写入 .gitignore，过滤文件从更改列表隐藏

            ### 全局与性能
            - 侧栏新增「打开工作区」按钮；安全设置信任列表折叠化；@ 提及支持绝对路径/盘符
            - 启动提速（瞬间打开 + 渐进加载）；构建加速约 15%；Win 打包提速（跳过原生重编译、dist:win:fast）
            - 扩展卸载同步移除于提示词扩展；README 重写

            ## What's New (0.2.1 stable)

            Cloud ASR with automatic Xiaomi MiMo routing, voice-recognition fixes, a session info panel, chat & Git polish, and faster startup/packaging.

            ### Speech (ASR)
            - Cloud ASR: first-use backend chooser, local/cloud tabs, auto API format (MiMo uses chat/completions + input_audio, Chinese defaults to language=zh), recorded audio uploads automatically
            - Fixed garbled recognition (3x-compressed audio from double resampling); linear-interpolation downsampling
            - Empty transcripts show a friendly hint; redesigned voice settings dialog
            - Boot overlay waits for extensions/skills before fading (new blob loader animation)

            ### Sessions & Chat
            - Session info button shows loaded tools, extensions, skills and files read
            - The process fold bar can be re-folded anytime; history shows user messages + summary + final answer
            - Retry resumes silently (no "Continue" bubble)
            - Fixed UI lag during long-running commands (capped streamed output)
            - Pasted images merge into the image with cache cleanup; right-click copy/save; images/tags survive session switches

            ### Git & Files
            - Stage/unstage, commit file list, soft/hard reset, per-file diff & restore
            - Right-click filter writes .gitignore rules; filtered files leave the Changes list

            ### Global & Performance
            - "Open workspace" button in the sidebar; foldable trusted-workspace list; @ mentions match absolute/drive-letter paths
            - Instant open + progressive loading; ~15% faster build; faster Windows packaging (skip native rebuild, dist:win:fast)
            - Uninstall removes extensions from prompt extensions; README rewrite

            ## ?? / Downloads
            - **Windows x64**: `Pi Desktop-*-win-x64-setup.exe`
            - **Windows ARM64**: `Pi Desktop-*-win-arm64-setup.exe`
            - **macOS Apple Silicon**: `Pi Desktop-*-mac-arm64.dmg`
            - **macOS Intel**: `Pi Desktop-*-mac-x64.dmg`

            ## ?? / Notes
            - ????**?????**?? prerelease?
            - macOS ?????????????? ? ??
            - This is a **stable** release
            - macOS is unsigned/notarization off ? first open may need right-click ? Open

          files: upload/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
