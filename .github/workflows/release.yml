# Release packaging + GitHub Release: ONLY on push to main (or manual dispatch).
# Tags and `dev` must NOT trigger this workflow. Use ci.yml for PR/dev checks.
#
# One job = one OS/arch installer (never fat / multi-arch packages).
name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish GitHub Release artifacts"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  # Never cancel an in-flight release — previous runs were aborted mid macOS build
  # when a follow-up push to main arrived (cancel-in-progress: true).
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build (${{ matrix.name }})
    needs: check
    runs-on: ${{ matrix.os }}
    # Fail fast instead of sitting in a scarce-runner void for hours.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            dugite_arch: x64
            build_cmd: npm run dist:win:x64
            artifact_glob: release/*-setup.exe
          - name: windows-arm64
            # Separate job → separate NSIS (not a fat installer). Cross-arch Electron + node-pty prebuilds.
            os: windows-latest
            dugite_arch: arm64
            build_cmd: npm run dist:win:arm64
            artifact_glob: release/*-setup.exe
          - name: macos-arm64
            os: macos-latest
            dugite_arch: arm64
            build_cmd: npm run dist:mac:arm64
            artifact_glob: release/*.dmg
          - name: macos-x64
            # Intel DMG on Apple Silicon runners. Avoid macos-13 (scarce / long queue).
            # dist:mac:x64 rebuilds node-pty for x64 then packages with npmRebuild=false
            # (cross-arch electron-builder rebuild often SIGABRT / exit 134).
            os: macos-latest
            dugite_arch: x64
            build_cmd: npm run dist:mac:x64
            artifact_glob: release/*.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # dugite postinstall fetches host-arch Git; cross-arch jobs must refresh before pack.
      - name: Ensure dugite embedded Git (${{ matrix.dugite_arch }})
        run: node scripts/ensure-dugite-git.mjs ${{ matrix.dugite_arch }}

      - name: Generate icons
        run: npm run icons

      - name: Build & package
        env:
          # Prevent electron-builder from creating/updating GitHub Releases mid-build
          # (publish is handled solely by the softprops job below).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip Apple identity discovery — unsigned builds; avoids notarize/signing hangs.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Monaco / Vite can OOM-abort (exit 134) on macOS runners without a larger heap.
          NODE_OPTIONS: --max-old-space-size=8192
        run: ${{ matrix.build_cmd }} -- --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pi-desktop-${{ matrix.name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: [check, build]
    # Publish whatever arch artifacts succeeded (don't block the whole release on one matrix cell).
    if: >
      always() &&
      needs.check.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p upload
          find dist-artifacts -type f \( -name '*-setup.exe' -o -name '*.dmg' -o -name '*.AppImage' \) -print -exec cp {} upload/ \;
          echo "=== release assets ==="
          ls -lah upload || true
          count=$(find upload -type f | wc -l | tr -d ' ')
          if [ "$count" -lt 1 ]; then
            echo "No release assets found" >&2
            exit 1
          fi

      - name: Read version
        id: ver
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Pi Desktop ${{ steps.ver.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |

            ## 主要更新（v0.3.0）

            本版重点：聊天界面全面对齐 opencode；内置待办工具与逐条计时；回合结束展示修改文件列表。

            ### 新功能 Features
            - 聊天界面全面对齐 opencode：工具调用、思考块全程内联展示，不再折叠成过程卡片；用户消息改为中性气泡 + 附件 chip + 悬停操作行。
            - 回合结束展示修改文件列表：`修改了 N 个文件  +a −d`，可展开逐文件查看增删行数，点击直接在预览打开。
            - 内置 `todo_write` 待办工具：每次调用全量替换列表；面板逐条独立计时（进行中实时跳动、完成即冻结）并显示总用时；进行中的待办有旋转图标与头部呼吸灯。
            - 会话侧栏 opencode 风格：单行紧凑会话行、状态彩点、顶部会话搜索框、工作区数量徽标。
            - 自定义模型「拉取模型」升级为可勾选的模型列表弹层：搜索过滤、全选/清空，确认后才写入草稿。

            ### 修复 / 体验 Fixes
            - 待办数据串台修复：列表一律全量替换，旧条目不可能残留；新任务自动清空上一轮列表，已完成项不会复活。
            - 停止 Agent 时待办进入「已暂停」而非完成态：可选「继续任务」（保留列表跳过一次重置）或「删除列表」；自然跑完才自动补完结并冻结总用时。

            ## What's New (v0.3.0)

            The chat UI is now fully aligned with opencode; a built-in todo tool with per-item timers; per-turn changed-files summaries.

            ### Features
            - opencode-style chat timeline: tool calls and thinking blocks render inline (no folded process cards); neutral user bubbles with attachment chips and hover actions.
            - Per-turn changed-files summary after each finished turn — expandable list with +/- line counts, click opens the file in Preview.
            - Built-in `todo_write` tool: every call fully replaces the list; per-item live timers (frozen on completion), total round time, animated spinner and pulsing badge while running.
            - opencode-style session sidebar: compact single-line rows with status dots, session search box, workspace count badges.
            - Custom models "Fetch" now opens a pickable model-list dialog before writing selected rows into the draft.

            ### Fixes
            - Todo lists no longer bleed across tasks: full-replace updates and a clean slate on every new task.
            - Stopping the agent pauses todos instead of completing them — Continue task or Delete list; natural finishes still auto-close with frozen total time.

            ## 下载 / Downloads
            - **Windows x64**: `Pi Desktop-*-win-x64-setup.exe`
            - **Windows ARM64**: `Pi Desktop-*-win-arm64-setup.exe`
            - **macOS Apple Silicon**: `Pi Desktop-*-mac-arm64.dmg`
            - **macOS Intel**: `Pi Desktop-*-mac-x64.dmg`

            ## 说明 / Notes
            - 本版本为**正式稳定版**（非 prerelease）
            - macOS 未公证：首次打开可能需要右键 → 打开
            - This is a **stable** release
            - macOS is unsigned/notarization off — first open may need right-click — Open

          files: upload/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
