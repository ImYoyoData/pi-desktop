# Release packaging + GitHub Release: ONLY on push to main (or manual dispatch).
# Tags and `dev` must NOT trigger this workflow. Use ci.yml for PR/dev checks.
#
# One job = one OS/arch installer (never fat / multi-arch packages).
name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish GitHub Release artifacts"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  # Never cancel an in-flight release — previous runs were aborted mid macOS build
  # when a follow-up push to main arrived (cancel-in-progress: true).
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build (${{ matrix.name }})
    needs: check
    runs-on: ${{ matrix.os }}
    # Fail fast instead of sitting in a scarce-runner queue for hours.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            dugite_arch: x64
            eb_args: --win --x64
            artifact_glob: release/*-setup.exe
          - name: windows-arm64
            # Separate job → separate NSIS (not a fat installer). Cross-arch Electron + node-pty prebuilds.
            os: windows-latest
            dugite_arch: arm64
            eb_args: --win --arm64
            artifact_glob: release/*-setup.exe
          - name: macos-arm64
            os: macos-latest
            dugite_arch: arm64
            eb_args: --mac --arm64
            artifact_glob: release/*.dmg
          - name: macos-x64
            # Intel DMG on Apple Silicon runners. Avoid macos-13 (scarce / long queue).
            # Cross-arch npmRebuild often SIGABRT (exit 134); rebuild node-pty for x64
            # first, then package with npmRebuild disabled.
            os: macos-latest
            dugite_arch: x64
            eb_args: --mac --x64
            artifact_glob: release/*.dmg
            cross_arch_native: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate icons
        run: npm run icons

      - name: Build app (electron-vite)
        run: npm run build

      # dugite postinstall fetches host-arch Git; cross-arch jobs must refresh before pack.
      - name: Ensure dugite embedded Git (${{ matrix.dugite_arch }})
        run: node scripts/ensure-dugite-git.mjs ${{ matrix.dugite_arch }}

      - name: Rebuild native modules for target arch
        if: matrix.cross_arch_native
        shell: bash
        env:
          npm_config_arch: ${{ matrix.dugite_arch }}
          npm_config_target_arch: ${{ matrix.dugite_arch }}
        run: |
          set -euo pipefail
          # Rosetta helps some x64 tooling on Apple Silicon runners.
          if [[ "${{ runner.os }}" == "macOS" && "${{ matrix.dugite_arch }}" == "x64" ]]; then
            sudo softwareupdate --install-rosetta --agree-to-license || true
          fi
          # Drop host-arch build trees so a wrong .node cannot be packed.
          rm -rf node_modules/node-pty/build node_modules/node-pty/prebuilds || true
          npx --yes @electron/rebuild --force --only=node-pty --arch="${{ matrix.dugite_arch }}"

      - name: Package with electron-builder
        env:
          # Prevent electron-builder from creating/updating GitHub Releases mid-build
          # (publish is handled solely by the softprops job below).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip Apple identity discovery — unsigned builds; avoids notarize/signing hangs.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          npm_config_arch: ${{ matrix.dugite_arch }}
          npm_config_target_arch: ${{ matrix.dugite_arch }}
        shell: bash
        run: |
          set -euo pipefail
          # Cross-arch: we already rebuilt node-pty; skip electron-builder's rebuild
          # (that path frequently aborts with exit 134 / SIGABRT on macos-x64).
          if [[ "${{ matrix.cross_arch_native }}" == "true" ]]; then
            npx electron-builder ${{ matrix.eb_args }} --publish never -c.npmRebuild=false
          else
            npx electron-builder ${{ matrix.eb_args }} --publish never
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pi-desktop-${{ matrix.name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: build
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p upload
          find dist-artifacts -type f \( -name '*-setup.exe' -o -name '*.dmg' -o -name '*.AppImage' \) -print -exec cp {} upload/ \;
          echo "=== release assets ==="
          ls -lah upload || true
          count=$(find upload -type f | wc -l | tr -d ' ')
          if [ "$count" -lt 1 ]; then
            echo "No release assets found" >&2
            exit 1
          fi

      - name: Read version
        id: ver
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Pi Desktop ${{ steps.ver.outputs.tag }}
          draft: false
          prerelease: true
          generate_release_notes: true
          body: |
            ## 主要更新
            - **安全与信任**：工作区信任对话框；设置 → 安全；按工具类别询问/允许；Bash 命令前缀白名单；已信任工作区可单独配置工具权限（全局权限在下方并已说明）
            - **权限确认条**：bash / 写文件操作可「允许一次」「本会话允许此类」「加入白名单」「后台运行」「拒绝」
            - **终端链接**：单击 URL 打开内置浏览器；Ctrl/Cmd+单击可选择系统浏览器或内置浏览
            - **清除上下文**：侧栏右键清除上下文会同时清空对话记录（不再只做压缩）
            - **斜杠命令**：输入 `/` 可快速 `/new`、`/compact`、`/model` 与 skills
            - **Bash 后台运行**：权限条与工具卡片支持转到后台；Running 页用只读终端展示输出
            - **其它**：冷启动优化、内置 Git（dugite）修复、扩展 UI 桥接、界面更紧凑与中英双语补齐

            ## What's New
            - **Security & trust**: workspace trust dialog; Settings → Security; ask/allow per tool category; bash command **prefix** allowlist; per-trusted-workspace tool permissions (global defaults explained below)
            - **Permission strip**: allow once / allow category for session / add to allowlist / run in background / deny
            - **Terminal links**: click opens built-in browser; Ctrl/Cmd+click chooses system or in-app browser
            - **Clear context**: sidebar action clears chat history as well (not compact-only)
            - **Slash commands**: `/` menu for `/new`, `/compact`, `/model`, and skills
            - **Background bash**: permission strip + tool card; Running tab uses a read-only xterm view
            - **Also**: faster cold start, embedded Git (dugite) fix, extension UI bridge, denser security UI, zh/en copy

            ## 下载（每个系统/架构单独安装包）
            - **Windows x64**: `Pi Desktop-*-win-x64-setup.exe`
            - **Windows ARM64**: `Pi Desktop-*-win-arm64-setup.exe`
            - **macOS Apple Silicon**: `Pi Desktop-*-mac-arm64.dmg`
            - **macOS Intel**: `Pi Desktop-*-mac-x64.dmg`

            仅分架构独立包，无 universal / fat 安装包。

            ## Downloads (one installer per OS / arch)
            - **Windows x64**: `Pi Desktop-*-win-x64-setup.exe`
            - **Windows ARM64**: `Pi Desktop-*-win-arm64-setup.exe`
            - **macOS Apple Silicon**: `Pi Desktop-*-mac-arm64.dmg`
            - **macOS Intel**: `Pi Desktop-*-mac-x64.dmg`

            Separate packages only — no universal / fat installer.

            ## 说明 / Notes
            - 本版本为 **prerelease 测试版**
            - macOS 未公证：首次打开可能需要右键 → 打开
            - This is a **prerelease** test build
            - macOS is unsigned/notarization off — first open may need right-click → Open
          files: upload/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
