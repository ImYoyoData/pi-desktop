# Release packaging + GitHub Release: ONLY on push to main (or manual dispatch).
# Tags and `dev` must NOT trigger this workflow. Use ci.yml for PR/dev checks.
#
# One job = one OS/arch installer (never fat / multi-arch packages).
name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish GitHub Release artifacts"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  # Never cancel an in-flight release — previous runs were aborted mid macOS build
  # when a follow-up push to main arrived (cancel-in-progress: true).
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build (${{ matrix.name }})
    needs: check
    runs-on: ${{ matrix.os }}
    # Fail fast instead of sitting in a scarce-runner void for hours.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            dugite_arch: x64
            build_cmd: npm run dist:win:x64
            artifact_glob: release/*-setup.exe
          - name: windows-arm64
            # Separate job → separate NSIS (not a fat installer). Cross-arch Electron + node-pty prebuilds.
            os: windows-latest
            dugite_arch: arm64
            build_cmd: npm run dist:win:arm64
            artifact_glob: release/*-setup.exe
          - name: macos-arm64
            os: macos-latest
            dugite_arch: arm64
            build_cmd: npm run dist:mac:arm64
            artifact_glob: release/*.dmg
          - name: macos-x64
            # Intel DMG on Apple Silicon runners. Avoid macos-13 (scarce / long queue).
            # dist:mac:x64 rebuilds node-pty for x64 then packages with npmRebuild=false
            # (cross-arch electron-builder rebuild often SIGABRT / exit 134).
            os: macos-latest
            dugite_arch: x64
            build_cmd: npm run dist:mac:x64
            artifact_glob: release/*.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # dugite postinstall fetches host-arch Git; cross-arch jobs must refresh before pack.
      - name: Ensure dugite embedded Git (${{ matrix.dugite_arch }})
        run: node scripts/ensure-dugite-git.mjs ${{ matrix.dugite_arch }}

      - name: Generate icons
        run: npm run icons

      - name: Build & package
        env:
          # Prevent electron-builder from creating/updating GitHub Releases mid-build
          # (publish is handled solely by the softprops job below).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip Apple identity discovery — unsigned builds; avoids notarize/signing hangs.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Monaco / Vite can OOM-abort (exit 134) on macOS runners without a larger heap.
          NODE_OPTIONS: --max-old-space-size=8192
        run: ${{ matrix.build_cmd }} -- --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pi-desktop-${{ matrix.name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: [check, build]
    # Publish whatever arch artifacts succeeded (don't block the whole release on one matrix cell).
    if: >
      always() &&
      needs.check.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p upload
          find dist-artifacts -type f \( -name '*-setup.exe' -o -name '*.dmg' -o -name '*.AppImage' \) -print -exec cp {} upload/ \;
          echo "=== release assets ==="
          ls -lah upload || true
          count=$(find upload -type f | wc -l | tr -d ' ')
          if [ "$count" -lt 1 ]; then
            echo "No release assets found" >&2
            exit 1
          fi

      - name: Read version
        id: ver
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Pi Desktop ${{ steps.ver.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |

            ## 主要更新（v0.2.4）

            本版聚焦：无 Node 环境完整支持、会话信息卡片化、撤回按钮持久化、多项交互修复。

            ### 新功能 Features
            - **无 Node 环境完整支持**：内置 npm 包 + Electron Node 运行时，用户电脑没有 Node/npm/pi 命令也能安装扩展、初始化全局 pi 配置。检测优先级：系统 pi CLI > 系统 npm/pnpm/bun > 内置 npm——有环境的用户行为不变，无环境用户自动走内置路径。
            - 会话信息弹窗：工具/技能/扩展改卡片显示（名称 + 简要），读取的文件保持列表，全部支持内部滚动与折叠。
            - 撤回按钮状态持久化：checkpoint 摘要（状态 + 文件数）落盘，切换会话/重启后历史消息的撤回按钮仍可恢复显示。
            - Changes 面板：推送/拉取/拉取更新按钮操作时显示加载中 spinner，不再看起来像卡住。
            - 会话结束卡片显示统计：用时 · 总 token · token/秒（行内紧凑，悬停看完整信息）。
            - 用户消息改为明显的右侧卡片，长内容可展开/收起；吸顶时整卡吸顶同样支持展开。
            - 聊天列表布局优化：行类型化间距 + 工具行缩进竖线，思考/工具/正文层次清晰。
            - 流式回答文本 shimmer 高亮扫过动画。

            ### 修复 Fixes
            - 吸顶时机修复：改用真实 DOM 测量，整条用户消息完全滚出视口才吸顶。
            - 修复待发送队列编辑后双套消息/意外撤回/agent 卡死：编辑不再误入队 + 同会话 prompt 严格串行。
            - 修复用户消息重新编辑后发送丢失后续内容（编辑后作为新消息追加）。
            - 修复录音后光标丢失：录音/停止/取消/确认按钮全部不夺焦，转写插入光标位置（无光标则末尾）。
            - 修复 Running 面板终端空白：命令回显到终端（$ command），不污染 LLM 工具结果。
            - 修复 todo 扩展语法错误导致 Tool todo not found（扩展已回滚至基础版）。
            - 修复测试在带 PI_DESKTOP_PI_CLI_PATH 环境变量时失败。

            ## What's New (v0.2.4)

            Full support for machines without Node/npm (bundled npm + Electron's Node), card-style session info, persisted revert buttons, and a batch of interaction fixes.

            ### Features
            - No-Node support: the app ships a bundled npm package and runs it with Electron's bundled Node, so extension installs and global Pi config init work with no system Node. Priority: system pi CLI > system npm/pnpm/bun > bundled npm — existing setups keep today's behavior.
            - Session info dialog: tools/skills/extensions render as cards (name + brief); files read stay a list; every section folds and scrolls internally.
            - Revert-button state is persisted (status + file count), surviving session switches / app restarts.
            - Changes panel: fetch/pull/push buttons show a spinner while running.
            - Turn stats on the finished assistant card: duration · total tokens · tokens/sec.
            - User messages are clear right-aligned cards with expand/collapse; the sticky header pins the whole card.
            - Chat list layout: typed row spacing + indented tool rows; streaming answers get a shimmer sweep.

            ### Fixes
            - Sticky-pin uses real measured offsets (pins only when the whole user row is above the viewport).
            - Fixed duplicate sends / stray revert buttons / frozen agent after editing a queued item (no stray re-enqueue + per-session serial prompts).
            - Fixed re-edit of a user message wiping later history (edited text is appended as a new message).
            - Fixed caret loss after dictation (mic buttons never steal focus; transcript inserts at the caret).
            - Fixed empty Running-panel terminals (command is echoed, without polluting the LLM tool result).
            - Fixed `Tool todo not found` from a quote-nesting syntax error (extension rolled back to baseline).
            - Fixed tests failing when PI_DESKTOP_PI_CLI_PATH is set in the host environment.

            ## 下载 / Downloads
            - **Windows x64**: `Pi Desktop-*-win-x64-setup.exe`
            - **Windows ARM64**: `Pi Desktop-*-win-arm64-setup.exe`
            - **macOS Apple Silicon**: `Pi Desktop-*-mac-arm64.dmg`
            - **macOS Intel**: `Pi Desktop-*-mac-x64.dmg`

            ## 说明 / Notes
            - 本版本为**正式稳定版**（非 prerelease）
            - macOS 未公证：首次打开可能需要右键 → 打开
            - This is a **stable** release
            - macOS is unsigned/notarization off — first open may need right-click — Open

          files: upload/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
