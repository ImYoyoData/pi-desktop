# Release packaging + GitHub Release: ONLY on push to main (or manual dispatch).
# Tags and `dev` must NOT trigger this workflow. Use ci.yml for PR/dev checks.
#
# One job = one OS/arch installer (never fat / multi-arch packages).
name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish GitHub Release artifacts"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  # Never cancel an in-flight release — previous runs were aborted mid macOS build
  # when a follow-up push to main arrived (cancel-in-progress: true).
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build (${{ matrix.name }})
    needs: check
    runs-on: ${{ matrix.os }}
    # Fail fast instead of sitting in a scarce-runner void for hours.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            dugite_arch: x64
            build_cmd: npm run dist:win:x64
            artifact_glob: release/*-setup.exe
          - name: windows-arm64
            # Separate job → separate NSIS (not a fat installer). Cross-arch Electron + node-pty prebuilds.
            os: windows-latest
            dugite_arch: arm64
            build_cmd: npm run dist:win:arm64
            artifact_glob: release/*-setup.exe
          - name: macos-arm64
            os: macos-latest
            dugite_arch: arm64
            build_cmd: npm run dist:mac:arm64
            artifact_glob: release/*.dmg
          - name: macos-x64
            # Intel DMG on Apple Silicon runners. Avoid macos-13 (scarce / long queue).
            # dist:mac:x64 rebuilds node-pty for x64 then packages with npmRebuild=false
            # (cross-arch electron-builder rebuild often SIGABRT / exit 134).
            os: macos-latest
            dugite_arch: x64
            build_cmd: npm run dist:mac:x64
            artifact_glob: release/*.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # dugite postinstall fetches host-arch Git; cross-arch jobs must refresh before pack.
      - name: Ensure dugite embedded Git (${{ matrix.dugite_arch }})
        run: node scripts/ensure-dugite-git.mjs ${{ matrix.dugite_arch }}

      - name: Generate icons
        run: npm run icons

      - name: Build & package
        env:
          # Prevent electron-builder from creating/updating GitHub Releases mid-build
          # (publish is handled solely by the softprops job below).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip Apple identity discovery — unsigned builds; avoids notarize/signing hangs.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Monaco / Vite can OOM-abort (exit 134) on macOS runners without a larger heap.
          NODE_OPTIONS: --max-old-space-size=8192
        run: ${{ matrix.build_cmd }} -- --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pi-desktop-${{ matrix.name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: [check, build]
    # Publish whatever arch artifacts succeeded (don't block the whole release on one matrix cell).
    if: >
      always() &&
      needs.check.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p upload
          find dist-artifacts -type f \( -name '*-setup.exe' -o -name '*.dmg' -o -name '*.AppImage' \) -print -exec cp {} upload/ \;
          echo "=== release assets ==="
          ls -lah upload || true
          count=$(find upload -type f | wc -l | tr -d ' ')
          if [ "$count" -lt 1 ]; then
            echo "No release assets found" >&2
            exit 1
          fi

      - name: Read version
        id: ver
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Pi Desktop ${{ steps.ver.outputs.tag }}
          draft: false
          prerelease: true
          generate_release_notes: true
          body: |

            ## 主要更新（v0.2.6）

            本版新增：局域网网页控制台－－手机/PC浏览器远程查看工作区/会话、聊天与语音识别（默认关闭，账号密码登录）。

            ### 新功能 Features
            - 局域网网页控制台（默认关闭）：标题栏左侧远程图标入口，账号密码登录，签发 6 小时会话 token（刷新免重登）。
            - 响应式 Vue + Naive UI 界面（与桌面同款组件库）：工作区手风琴展开会话、聊天、发送消息。
            - 语音识别：网页录音 → HTTP 代理 → 桌面配置的识别方式（本地/云端）；点击录音、再点识别，含「正在转换」加载效果。
            - 安全：HTTPS 自签证书(EC P-256，手机握手更快）、token 鉴权、开关状态持久化、重启自动开启。
            - 性能：历史刷新合并防抖、渲染去重、WS保活，移动端连接与体验更流畅。

            ## What's New (v0.2.6)

            LAN web console: browse workspaces/sessions, chat and use voice recognition from a phone or PC browser (off by default, username/password login).

            ### Features
            - LAN web console (off by default): remote icon in the title bar, username/password login with a 6-hour session token (refresh stays logged in).
            - Responsive Vue + Naive UI page (same component library as the desktop): accordion workspaces with inline sessions, chat and messaging.
            - Voice: record in the browser, proxy through /api/transcribe, recognize with the desktop's configured ASR (local or cloud); click to record, click again to convert.
            - Security: HTTPS self-signed EC P-256 cert (faster mobile handshake), token auth, switch persists and auto-starts on launch.
            - Performance: coalesced history refreshes, render de-dup, WS keepalive; smoother mobile connection and UX.

            ## 下载 / Downloads
            - **Windows x64**: `Pi Desktop-*-win-x64-setup.exe`
            - **Windows ARM64**: `Pi Desktop-*-win-arm64-setup.exe`
            - **macOS Apple Silicon**: `Pi Desktop-*-mac-arm64.dmg`
            - **macOS Intel**: `Pi Desktop-*-mac-x64.dmg`

            ## 说明 / Notes
            - 本版本为**正式稳定版**（非 prerelease）
            - macOS 未公证：首次打开可能需要右键 → 打开
            - This is a **stable** release
            - macOS is unsigned/notarization off — first open may need right-click — Open

          files: upload/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
