#file: noinspection UndefinedParamsPresent
# Release packaging + GitHub Release: ONLY on push to main (or manual dispatch).
# Tags and `dev` must NOT trigger this workflow. Use ci.yml for PR/dev checks.
#
# One job = one OS/arch installer (never fat / multi-arch packages).
name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish GitHub Release artifacts"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  # Never cancel an in-flight release — previous runs were aborted mid macOS build
  # when a follow-up push to main arrived (cancel-in-progress: true).
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  version:
    name: Check version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.v.outputs.changed }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # 同一版本号只发布一次：tag 已存在就跳过整条发布链；手动 dispatch 时强制重发。
      - name: Detect version tag
        id: v
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REF="repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG"
          if STATUS=$(gh api "$REF" 2>&1 >/dev/null); then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [[ "$STATUS" == *"HTTP 404"* ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag lookup failed: $STATUS" >&2
            exit 1
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: [check, version]
    if: needs.version.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    # Fail fast instead of sitting in a scarce-runner void for hours.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            dugite_arch: x64
            build_cmd: npm run dist:win:x64
            artifact_glob: release/*-setup.exe
          - name: windows-arm64
            # Separate job → separate NSIS (not a fat installer). Cross-arch Electron + node-pty prebuilds.
            os: windows-latest
            dugite_arch: arm64
            build_cmd: npm run dist:win:arm64
            artifact_glob: release/*-setup.exe
          - name: macos-arm64
            os: macos-latest
            dugite_arch: arm64
            build_cmd: npm run dist:mac:arm64
            artifact_glob: release/*.dmg
          - name: macos-x64
            # Intel DMG on Apple Silicon runners. Avoid macos-13 (scarce / long queue).
            # dist:mac:x64 rebuilds node-pty for x64 then packages with npmRebuild=false
            # (cross-arch electron-builder rebuild often SIGABRT / exit 134).
            os: macos-latest
            dugite_arch: x64
            build_cmd: npm run dist:mac:x64
            artifact_glob: release/*.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # dugite post install fetches host-arch Git; cross-arch jobs must refresh before pack.
      - name: Ensure dugite embedded Git (${{ matrix.dugite_arch }})
        run: node scripts/ensure-dugite-git.mjs ${{ matrix.dugite_arch }}

      - name: Generate icons
        run: npm run icons

      - name: Build & package
        env:
          # Prevent electron-builder from creating/updating GitHub Releases mid-build
          # (publish is handled solely by the softprops job below).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip Apple identity discovery — unsigned builds; avoids notarize/signing hangs.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Monaco / Vite can OOM-abort (exit 134) on macOS runners without a larger heap.
          NODE_OPTIONS: --max-old-space-size=8192
        # --publish never 由各 dist 脚本自带；此处追加 `-- --publish never` 会被 npm
        # 附到脚本末尾，落到嵌套的 npm run 上并作为未知 CLI 配置直接报错。
        run: ${{ matrix.build_cmd }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pi-desktop-${{ matrix.name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: [check, version, build]
    # Publish whatever arch artifacts succeeded (don't block the whole release on one matrix cell).
    if: >
      always() &&
      needs.check.result == 'success' &&
      needs.version.outputs.changed == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p upload
          find dist-artifacts -type f \( -name '*-setup.exe' -o -name '*.dmg' -o -name '*.AppImage' \) -print -exec cp {} upload/ \;
          echo "=== release assets ==="
          ls -lah upload || true
          count=$(find upload -type f | wc -l | tr -d ' ')
          if [ "$count" -lt 1 ]; then
            echo "No release assets found" >&2
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Pi Desktop ${{ needs.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |

            ## 主要更新（v0.3.5-rc.4）

            本版重点：跟进 pi 1.0.0（SDK 从 0.99.2 升级），修复 MCP OAuth 凭据的
            读写，打包时附带 pi 的文档资源，并接入 1.0.0 的两项新能力。

            ### 新功能 Features

            - **MCP OAuth 支持授权服务器元数据地址**：服务器发布的 OAuth 授权服务器
              元数据地址不符合规范、或未发布时，可在 MCP 服务器的「OAuth 高级设置」里
              填写 `authServerMetadataUrl`，登录直接使用该地址，不再依赖自动探测。
            - **工具结果里的图片会显示出来**：codemode 生成图（`image()` /
              `models.generateImages()`）等工具返回的图片块，现在会在工具卡片中直接
              渲染（最多 8 张，随卡片展开）。

            - **Authorization server metadata URL for MCP OAuth**: when a server
              advertises a wrong OAuth authorization server metadata document (or
              none), set `authServerMetadataUrl` in the MCP server's OAuth advanced
              settings so sign-in uses that address instead of discovery.
            - **Images from tool results are shown**: image blocks returned by
              tools such as codemode generation (`image()` /
              `models.generateImages()`) now render inside the tool card (up to 8,
              when expanded).

            ### 变更 Changes

            - **升级 pi 到 1.0.0**：`@earendil-works/pi-coding-agent`、
              `@earendil-works/pi-agent-core`、`@earendil-works/pi-ai` 从 0.99.2
              升到 1.0.0。

            - **Upgraded pi to 1.0.0**: `@earendil-works/pi-coding-agent`,
              `@earendil-works/pi-agent-core` and `@earendil-works/pi-ai` moved from
              0.99.2 to 1.0.0.

            ### 修复 Fixes

            - **修复 MCP OAuth 登录状态显示未认证、登出无效**：pi 1.0.0 把 MCP
              OAuth 凭据改为按「服务器名 + URL」存储，旧的单参数调用按 URL 读不到新
              凭据。现在按服务器名与 URL 读写，1.0.0 的首个使用同一 URL 的服务器也会
              自动接管旧凭据（旧凭据不会丢）。
            - **修复打包版里模型读不到 pi 文档**：1.0.0 的 codemode 提示词只保留一行
              摘要，细节引导模型去读 `docs/codemode.md`（models API、图像生成等），
              而 asar 打包会排除所有 `.md`，模型读到的路径不存在。现在打包时把 pi 的
              `package.json`、`README.md`、`CHANGELOG.md`、`docs/`、`examples/`
              作为 extraResources 附带到 `resources/pi-package`，并让
              `PI_PACKAGE_DIR` 指向它。

            - **Fixed MCP OAuth showing "not authenticated" and logout doing
              nothing**: pi 1.0.0 stores MCP OAuth credentials per server name and
              URL, so the old single-argument calls keyed by URL alone could not
              read the new credentials. Reads and writes now pass both, and the
              first server using a URL takes over credentials stored by older
              versions (nothing is lost).
            - **Fixed the packaged app being unable to read pi's docs**: pi 1.0.0's
              codemode prompt keeps only a one-line summary and points the model at
              `docs/codemode.md` (models API, image generation, …), but the asar
              excludes every `.md`, so the model was given a path that does not
              exist. The build now ships pi's `package.json`, `README.md`,
              `CHANGELOG.md`, `docs/` and `examples/` as extraResources under
              `resources/pi-package`, with `PI_PACKAGE_DIR` pointing there.

            ## 下载 / Downloads
            - **Windows x64**: `Pi Desktop-*-win-x64-setup.exe`
            - **Windows ARM64**: `Pi Desktop-*-win-arm64-setup.exe`
            - **macOS Apple Silicon**: `Pi Desktop-*-mac-arm64.dmg`
            - **macOS Intel**: `Pi Desktop-*-mac-x64.dmg`

          files: upload/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
