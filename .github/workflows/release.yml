#file: noinspection UndefinedParamsPresent
# Release packaging + GitHub Release: ONLY on push to main (or manual dispatch).
# Tags and `dev` must NOT trigger this workflow. Use ci.yml for PR/dev checks.
#
# One job = one OS/arch installer (never fat / multi-arch packages).
name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish GitHub Release artifacts"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  # Never cancel an in-flight release — previous runs were aborted mid
  # macOS build when a follow-up push to main arrived
  # (cancel-in-progress: true).
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  version:
    name: Check version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.v.outputs.changed }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # 同一版本号只发布一次：tag 已存在就跳过整条发布链；手动 dispatch 时强制重发。
      - name: Detect version tag
        id: v
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REF="repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG"
          if STATUS=$(gh api "$REF" 2>&1 >/dev/null); then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [[ "$STATUS" == *"HTTP 404"* ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag lookup failed: $STATUS" >&2
            exit 1
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: [check, version]
    if: needs.version.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    # Fail fast instead of sitting in a scarce-runner void for hours.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            dugite_arch: x64
            build_cmd: npm run dist:win:x64
            artifact_glob: release/*-setup.exe
          - name: windows-arm64
            # Separate job → separate NSIS (not a fat installer).
            # Cross-arch Electron + node-pty prebuilds.
            os: windows-latest
            dugite_arch: arm64
            build_cmd: npm run dist:win:arm64
            artifact_glob: release/*-setup.exe
          - name: macos-arm64
            os: macos-latest
            dugite_arch: arm64
            build_cmd: npm run dist:mac:arm64
            artifact_glob: release/*.dmg
          - name: macos-x64
            # Intel DMG on Apple Silicon runners. Avoid macos-13
            # (scarce / long queue).
            # dist:mac:x64 rebuilds node-pty for x64 then packages with
            # npmRebuild=false
            # (cross-arch electron-builder rebuild often SIGABRT / exit 134).
            os: macos-latest
            dugite_arch: x64
            build_cmd: npm run dist:mac:x64
            artifact_glob: release/*.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # dugite post install fetches host-arch Git; cross-arch jobs must
      # refresh before pack.
      - name: Ensure dugite embedded Git (${{ matrix.dugite_arch }})
        run: node scripts/ensure-dugite-git.mjs ${{ matrix.dugite_arch }}

      - name: Generate icons
        run: npm run icons

      - name: Build & package
        env:
          # Prevent electron-builder from creating/updating GitHub
          # Releases mid-build (publish is handled solely by the softprops
          # job below).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip Apple identity discovery — unsigned builds; avoids
          # notarize/signing hangs.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Monaco / Vite can OOM-abort (exit 134) on macOS runners
          # without a larger heap.
          NODE_OPTIONS: --max-old-space-size=8192
        # --publish never 由各 dist 脚本自带；此处追加 `-- --publish never` 会被 npm
        # 附到脚本末尾，落到嵌套的 npm run 上并作为未知 CLI 配置直接报错。
        run: ${{ matrix.build_cmd }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pi-desktop-${{ matrix.name }}
          path: |
            ${{ matrix.artifact_glob }}
            release/latest*.yml
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: [check, version, build]
    # Publish whatever arch artifacts succeeded (don't block the whole
    # release on one matrix cell).
    if: >
      always() &&
      needs.check.result == 'success' &&
      needs.version.outputs.changed == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p upload
          find dist-artifacts -type f \
            \( -name '*-setup.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name 'latest*.yml' \) \
            -print -exec cp {} upload/ \;
          echo "=== release assets ==="
          ls -lah upload || true
          count=$(find upload -type f | wc -l | tr -d ' ')
          if [ "$count" -lt 1 ]; then
            echo "No release assets found" >&2
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Pi Desktop ${{ needs.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |

            ## 主要更新

            本版重构桌面端界面与分发链路：渲染层从 Vue 迁移到 React，控件与设置页
            统一为 antd v6 的胶囊卡片风格；重写自动更新与安装包流程；补齐 Markdown
            相对路径图片解析；并修复多处渲染与交互问题。

            ### 新功能 Features

            - **自动更新**：版本检测、分片下载与安装后重启，标题栏与关于页展示下载进度。
            - **自定义安装器**：NSIS 脚本统一安装目录、检测新旧目录占用，安装包命名
              统一为 `Pi-Desktop-*`。
            - **Markdown 图片**：相对路径图片按文档所在目录解析。
            - **React 界面**：渲染层由 Vue 迁移到 React + antd v6，设置项统一为胶囊
              卡片风格，标题栏显示 Pi 图标。

            - **Auto update**: version check, chunked download and restart after
              install, with progress shown in the title bar and About panel.
            - **Custom installer**: the NSIS script normalizes the install
              directory, detects occupancy of old and new directories, and
              unifies package names as `Pi-Desktop-*`.
            - **Markdown images**: relative image paths resolve against the
              document directory.
            - **React UI**: renderer migrated from Vue to React + antd v6, with
              capsule-card settings and a Pi icon in the title bar.

            ### 变更 Changes

            - **精简入口**：移除欢迎页与空会话引导、会话分类、会话信息弹窗、
              消息预览、界面分隔线与工具输出截断开关、模式与提示定制项。
            - **视觉细节**：终端视口底色改透明，壁纸模式下修正浮层与控件表面。

            - **Simplified entry points**: removed the welcome page and empty-state
              guide, session categories, session info dialog, message previews,
              the divider and tool-output truncation switches, and the mode/tip
              customization items.
            - **Visual details**: transparent terminal viewport background, plus
              overlay and control surfaces fixed in wallpaper mode.

            ### 修复 Fixes

            - **消息区 Markdown 渲染失效**：容器 class 粘连导致聊天样式整块失效。
            - **分栏线拖不动**：拖拽监听被重渲染摘除、拖拽比例算错。
            - **虚拟滚动渲染问题**；后台截断来源可区分并接入 i18n。

            - **Message markdown rendering**: glued container classes broke the
              whole chat stylesheet.
            - **Split-pane divider**: the drag listener was removed on re-render
              and the ratio was computed incorrectly.
            - **Virtual scrolling** rendering issues; background truncation now
              reports its source and is localized.

            ## 下载 / Downloads
            - **Windows x64**: `Pi-Desktop-*-win-x64-setup.exe`
            - **Windows ARM64**: `Pi-Desktop-*-win-arm64-setup.exe`
            - **macOS Apple Silicon**: `Pi-Desktop-*-mac-arm64.dmg`
            - **macOS Intel**: `Pi-Desktop-*-mac-x64.dmg`

          files: upload/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
