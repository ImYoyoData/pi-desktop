#file: noinspection UndefinedParamsPresent
# Release packaging + GitHub Release: ONLY on push to main (or manual dispatch).
# Tags and `dev` must NOT trigger this workflow. Use ci.yml for PR/dev checks.
#
# One job = one OS/arch installer (never fat / multi-arch packages).
name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish GitHub Release artifacts"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  # Never cancel an in-flight release — previous runs were aborted mid macOS build
  # when a follow-up push to main arrived (cancel-in-progress: true).
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  version:
    name: Check version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.v.outputs.changed }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # 同一版本号只发布一次：tag 已存在就跳过整条发布链；手动 dispatch 时强制重发。
      - name: Detect version tag
        id: v
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REF="repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG"
          if STATUS=$(gh api "$REF" 2>&1 >/dev/null); then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [[ "$STATUS" == *"HTTP 404"* ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag lookup failed: $STATUS" >&2
            exit 1
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: [check, version]
    if: needs.version.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    # Fail fast instead of sitting in a scarce-runner void for hours.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            dugite_arch: x64
            build_cmd: npm run dist:win:x64
            artifact_glob: release/*-setup.exe
          - name: windows-arm64
            # Separate job → separate NSIS (not a fat installer). Cross-arch Electron + node-pty prebuilds.
            os: windows-latest
            dugite_arch: arm64
            build_cmd: npm run dist:win:arm64
            artifact_glob: release/*-setup.exe
          - name: macos-arm64
            os: macos-latest
            dugite_arch: arm64
            build_cmd: npm run dist:mac:arm64
            artifact_glob: release/*.dmg
          - name: macos-x64
            # Intel DMG on Apple Silicon runners. Avoid macos-13 (scarce / long queue).
            # dist:mac:x64 rebuilds node-pty for x64 then packages with npmRebuild=false
            # (cross-arch electron-builder rebuild often SIGABRT / exit 134).
            os: macos-latest
            dugite_arch: x64
            build_cmd: npm run dist:mac:x64
            artifact_glob: release/*.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # dugite post install fetches host-arch Git; cross-arch jobs must refresh before pack.
      - name: Ensure dugite embedded Git (${{ matrix.dugite_arch }})
        run: node scripts/ensure-dugite-git.mjs ${{ matrix.dugite_arch }}

      - name: Generate icons
        run: npm run icons

      - name: Build & package
        env:
          # Prevent electron-builder from creating/updating GitHub Releases mid-build
          # (publish is handled solely by the softprops job below).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip Apple identity discovery — unsigned builds; avoids notarize/signing hangs.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Monaco / Vite can OOM-abort (exit 134) on macOS runners without a larger heap.
          NODE_OPTIONS: --max-old-space-size=8192
        # --publish never 由各 dist 脚本自带；此处追加 `-- --publish never` 会被 npm
        # 附到脚本末尾，落到嵌套的 npm run 上并作为未知 CLI 配置直接报错。
        run: ${{ matrix.build_cmd }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pi-desktop-${{ matrix.name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: [check, version, build]
    # Publish whatever arch artifacts succeeded (don't block the whole release on one matrix cell).
    if: >
      always() &&
      needs.check.result == 'success' &&
      needs.version.outputs.changed == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p upload
          find dist-artifacts -type f \( -name '*-setup.exe' -o -name '*.dmg' -o -name '*.AppImage' \) -print -exec cp {} upload/ \;
          echo "=== release assets ==="
          ls -lah upload || true
          count=$(find upload -type f | wc -l | tr -d ' ')
          if [ "$count" -lt 1 ]; then
            echo "No release assets found" >&2
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Pi Desktop ${{ needs.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |

            ## 主要更新（v0.3.5-rc.1）

            本版重点：依赖全面升级——pi-agent 三件套升到 0.87.0、electron 升到 44，
            工具链同步升级并完成 API 适配；设置新增「重试」面板（自动重试、网络请求、
            卡死恢复档位），并修复 electron 44 下 dev 启动即报
            `Electron uninstall` 的问题。

            ### 新功能 Features

            - **「重试」设置页**：设置 → 通用新增「重试」面板，三组档位——自动重试
              （Pi SDK 回合层：开关、次数、指数退避基准间隔）、网络请求（HTTP 层
              重试次数、最大等待、请求超时）、卡死恢复（恢复次数上限、软挂起与卡死
              判定时长）。设置写入 `~/.pi/agent/settings.json` 的 `retry` 段，保存后
              热重载给活跃 worker 并同步所有窗口，卡死判定阈值即时在主进程生效。

            - **Retry settings page**: a new "Retry" panel under Settings →
              General with three groups — auto retry (Pi SDK turn layer: toggle,
              count, backoff base delay), network requests (HTTP-level retries,
              max retry delay, request timeout) and stuck recovery (recover
              attempts, soft-hang / stall silence). Values persist to the
              `retry` section of `~/.pi/agent/settings.json`, hot-reload
              into live workers on save, sync across windows, and apply
              the stall threshold in the main process immediately.

            ### 变更 Changes

            - **依赖全面升级**：`@earendil-works/pi-agent-core` / `pi-ai` /
              `pi-coding-agent` 0.85.1 → 0.87.0，electron 39 → 44，vue、vite、
              typescript、undici、electron-builder、node-pty 等同步升级到当前最新。

            - **electron 44 适配**：剪贴板写图改走 `ClipboardItem` + `write()`——旧
              `writeImage` 已从 `Clipboard` 移除，新 API 为 W3C 风格异步接口。

            - **pi-coding-agent 0.87 适配**：`emitBeforeAgentStart` 签名变更（不再
              单独传系统提示），系统提示改经 `BuildSystemPromptOptions` 传递。

            - **构建工具链取舍**：typescript 钉在 6.0.3（vue-tsc 尚不支持 TS 7 的原生
              tsgo）、vite 钉在 7.x（electron-vite 5 的 peer 上限）；`tsconfig.web.json`
              移除已废弃的 `baseUrl`，`paths` 改为相对路径。

            - **Dependencies upgraded across the board**: pi-agent-core /
              pi-ai / pi-coding-agent 0.85.1 → 0.87.0, electron 39 → 44, plus
              vue, vite, typescript, undici, electron-builder and node-pty to
              their latest.

            - **Electron 44 adaptation**: clipboard image writes now use
              `ClipboardItem` + `write()` — the old `writeImage` API was removed
              in favor of the W3C-style async clipboard API.

            - **pi-coding-agent 0.87 adaptation**: `emitBeforeAgentStart`
              changed its signature (the system prompt is no longer a standalone
              argument) and now receives it through `BuildSystemPromptOptions`.

            - **Build toolchain pins**: typescript stays at 6.0.3 (vue-tsc does
              not support the native tsgo-based TS 7 yet) and vite at 7.x (the
              peer range of electron-vite 5); `tsconfig.web.json` drops the
              deprecated `baseUrl` and resolves `paths` relatively.

            ### 修复 Fixes

            - **修复升级 electron 44 后 `npm run dev` 启动即报 `Electron uninstall`**：
              electron 44 的 npm 包不再自带 `postinstall` 下载脚本，`npm install` 后
              `node_modules/electron/dist` 缺失；现 `postinstall` 链首显式执行
              `node node_modules/electron/install.js`（沿用 `.npmrc` 镜像配置），全新
              安装与既有安装都能自动补齐二进制。

            - **Fixed `npm run dev` failing with `Electron uninstall` after the
              Electron 44 upgrade**: the electron 44 npm package no longer ships
              a `postinstall` download hook, so `npm install` left
              `node_modules/electron/dist` missing. The `postinstall` chain now
              runs `node node_modules/electron/install.js` first (using the
              `.npmrc` mirror config), so both fresh and existing installs
              fetch the binary automatically.

            ## 下载 / Downloads
            - **Windows x64**: `Pi Desktop-*-win-x64-setup.exe`
            - **Windows ARM64**: `Pi Desktop-*-win-arm64-setup.exe`
            - **macOS Apple Silicon**: `Pi Desktop-*-mac-arm64.dmg`
            - **macOS Intel**: `Pi Desktop-*-mac-x64.dmg`

          files: upload/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
