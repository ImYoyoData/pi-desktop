#file: noinspection UndefinedParamsPresent
# Release packaging + GitHub Release: ONLY on push to main (or manual dispatch).
# Tags and `dev` must NOT trigger this workflow. Use ci.yml for PR/dev checks.
#
# One job = one OS/arch installer (never fat / multi-arch packages).
name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish GitHub Release artifacts"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  # Never cancel an in-flight release — previous runs were aborted mid
  # macOS build when a follow-up push to main arrived
  # (cancel-in-progress: true).
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  version:
    name: Check version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.v.outputs.changed }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # 同一版本号只发布一次：tag 已存在就跳过整条发布链；手动 dispatch 时强制重发。
      - name: Detect version tag
        id: v
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REF="repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG"
          if STATUS=$(gh api "$REF" 2>&1 >/dev/null); then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [[ "$STATUS" == *"HTTP 404"* ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag lookup failed: $STATUS" >&2
            exit 1
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: [check, version]
    if: needs.version.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    # Fail fast instead of sitting in a scarce-runner void for hours.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            dugite_arch: x64
            build_cmd: npm run dist:win:x64
            artifact_glob: release/*-setup.exe
          - name: windows-arm64
            # Separate job → separate NSIS (not a fat installer).
            # Cross-arch Electron + node-pty prebuilds.
            os: windows-latest
            dugite_arch: arm64
            build_cmd: npm run dist:win:arm64
            artifact_glob: release/*-setup.exe
          - name: macos-arm64
            os: macos-latest
            dugite_arch: arm64
            build_cmd: npm run dist:mac:arm64
            artifact_glob: release/*.dmg
          - name: macos-x64
            # Intel DMG on Apple Silicon runners. Avoid macos-13
            # (scarce / long queue).
            # dist:mac:x64 rebuilds node-pty for x64 then packages with
            # npmRebuild=false
            # (cross-arch electron-builder rebuild often SIGABRT / exit 134).
            os: macos-latest
            dugite_arch: x64
            build_cmd: npm run dist:mac:x64
            artifact_glob: release/*.dmg
          - name: linux-x64
            # AppImage only (electron-builder.yml → linux.target).
            # node-pty linux-x64 prebuild comes from `npm ci`'s postinstall
            # (electron-builder install-app-deps) on the runner itself.
            os: ubuntu-latest
            dugite_arch: x64
            build_cmd: npm run dist:linux:x64
            artifact_glob: release/*.AppImage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # dugite post install fetches host-arch Git; cross-arch jobs must
      # refresh before pack.
      - name: Ensure dugite embedded Git (${{ matrix.dugite_arch }})
        run: node scripts/ensure-dugite-git.mjs ${{ matrix.dugite_arch }}

      - name: Generate icons
        run: npm run icons

      - name: Build & package
        env:
          # Prevent electron-builder from creating/updating GitHub
          # Releases mid-build (publish is handled solely by the softprops
          # job below).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip Apple identity discovery — unsigned builds; avoids
          # notarize/signing hangs.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Monaco / Vite can OOM-abort (exit 134) on macOS runners
          # without a larger heap.
          NODE_OPTIONS: --max-old-space-size=8192
        # --publish never 由各 dist 脚本自带；此处追加 `-- --publish never` 会被 npm
        # 附到脚本末尾，落到嵌套的 npm run 上并作为未知 CLI 配置直接报错。
        run: ${{ matrix.build_cmd }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pi-desktop-${{ matrix.name }}
          path: |
            ${{ matrix.artifact_glob }}
            release/latest*.yml
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: [check, version, build]
    # Publish whatever arch artifacts succeeded (don't block the whole
    # release on one matrix cell).
    if: >
      always() &&
      needs.check.result == 'success' &&
      needs.version.outputs.changed == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p upload
          find dist-artifacts -type f \
            \( -name '*-setup.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name 'latest*.yml' \) \
            -print -exec cp {} upload/ \;
          echo "=== release assets ==="
          ls -lah upload || true
          count=$(find upload -type f | wc -l | tr -d ' ')
          if [ "$count" -lt 1 ]; then
            echo "No release assets found" >&2
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Pi Desktop ${{ needs.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |

            ## 主要更新

            适配 Pi 1.5.0，引入 OMP（oh-my-pi）18.16.0 引擎；更新下载更快并复用本地 gh 登录态；修复斜杠命令菜单；设置页改为新布局。

            ### 新功能 Features

            - **引入 OMP 引擎（18.16.0）**：可全局切换 Pi / OMP，两者配置与会话独立；设置页新增 OMP 的模型 / 配置 / MCP。
            - **适配 Pi 1.5.0**：SDK 升到 1.5.0，斜杠命令清单同步更新。

            - **OMP engine (18.16.0)**: switch between Pi and OMP globally, each with its own config and sessions; Settings gained OMP Models / Config / MCP.
            - **Pi 1.5.0 support**: the SDK moved to 1.5.0 and the slash-command catalog is updated.

            ### 变更 Changes

            - **更新下载更快**：下载改成分片并发。
            - **复用本地 gh 登录态**：检查更新使用 `gh auth login` 的令牌。
            - **设置页新布局**：左栏并入标题栏，新增 Pi / OMP 二级页签。

            - **Faster update downloads**: downloads now run as concurrent segments.
            - **Local gh login reuse**: update checks use the `gh auth login` token.
            - **New Settings layout**: the side column moved into the title bar, with Pi / OMP sub-tabs.

            ### 修复 Fixes

            - **修复斜杠命令菜单无法使用**，并补全 OMP / Pi 的内建命令。

            - **Fixed the unusable slash-command menu** and completed the OMP / Pi built-in commands.

            ## 下载 / Downloads
            - **Windows x64**: `Pi-Desktop-*-win-x64-setup.exe`
            - **Windows ARM64**: `Pi-Desktop-*-win-arm64-setup.exe`
            - **macOS Apple Silicon**: `Pi-Desktop-*-mac-arm64.dmg`
            - **macOS Intel**: `Pi-Desktop-*-mac-x64.dmg`
            - **Linux x64**: `Pi-Desktop-*-linux-x86_64.AppImage`

          files: upload/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
