#file: noinspection UndefinedParamsPresent
# Release packaging + GitHub Release: ONLY on push to main (or manual dispatch).
# Tags and `dev` must NOT trigger this workflow. Use ci.yml for PR/dev checks.
#
# One job = one OS/arch installer (never fat / multi-arch packages).
name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish GitHub Release artifacts"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  # Never cancel an in-flight release — previous runs were aborted mid macOS build
  # when a follow-up push to main arrived (cancel-in-progress: true).
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  version:
    name: Check version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.v.outputs.changed }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # 同一版本号只发布一次：tag 已存在就跳过整条发布链；手动 dispatch 时强制重发。
      - name: Detect version tag
        id: v
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REF="repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG"
          if STATUS=$(gh api "$REF" 2>&1 >/dev/null); then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [[ "$STATUS" == *"HTTP 404"* ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag lookup failed: $STATUS" >&2
            exit 1
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: [check, version]
    if: needs.version.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    # Fail fast instead of sitting in a scarce-runner void for hours.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            dugite_arch: x64
            build_cmd: npm run dist:win:x64
            artifact_glob: release/*-setup.exe
          - name: windows-arm64
            # Separate job → separate NSIS (not a fat installer). Cross-arch Electron + node-pty prebuilds.
            os: windows-latest
            dugite_arch: arm64
            build_cmd: npm run dist:win:arm64
            artifact_glob: release/*-setup.exe
          - name: macos-arm64
            os: macos-latest
            dugite_arch: arm64
            build_cmd: npm run dist:mac:arm64
            artifact_glob: release/*.dmg
          - name: macos-x64
            # Intel DMG on Apple Silicon runners. Avoid macos-13 (scarce / long queue).
            # dist:mac:x64 rebuilds node-pty for x64 then packages with npmRebuild=false
            # (cross-arch electron-builder rebuild often SIGABRT / exit 134).
            os: macos-latest
            dugite_arch: x64
            build_cmd: npm run dist:mac:x64
            artifact_glob: release/*.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # dugite post install fetches host-arch Git; cross-arch jobs must refresh before pack.
      - name: Ensure dugite embedded Git (${{ matrix.dugite_arch }})
        run: node scripts/ensure-dugite-git.mjs ${{ matrix.dugite_arch }}

      - name: Generate icons
        run: npm run icons

      - name: Build & package
        env:
          # Prevent electron-builder from creating/updating GitHub Releases mid-build
          # (publish is handled solely by the softprops job below).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip Apple identity discovery — unsigned builds; avoids notarize/signing hangs.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Monaco / Vite can OOM-abort (exit 134) on macOS runners without a larger heap.
          NODE_OPTIONS: --max-old-space-size=8192
        # --publish never 由各 dist 脚本自带；此处追加 `-- --publish never` 会被 npm
        # 附到脚本末尾，落到嵌套的 npm run 上并作为未知 CLI 配置直接报错。
        run: ${{ matrix.build_cmd }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pi-desktop-${{ matrix.name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: [check, version, build]
    # Publish whatever arch artifacts succeeded (don't block the whole release on one matrix cell).
    if: >
      always() &&
      needs.check.result == 'success' &&
      needs.version.outputs.changed == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p upload
          find dist-artifacts -type f \( -name '*-setup.exe' -o -name '*.dmg' -o -name '*.AppImage' \) -print -exec cp {} upload/ \;
          echo "=== release assets ==="
          ls -lah upload || true
          count=$(find upload -type f | wc -l | tr -d ' ')
          if [ "$count" -lt 1 ]; then
            echo "No release assets found" >&2
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Pi Desktop ${{ needs.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |

            ## 主要更新（v0.3.5-rc.3）

            本版重点：修复自定义模型「保存后会话输入框选不了模型、看起来像没有模型配置」
            的问题 —— 一条过期的模型策展记录会把该提供商的模型全部过滤掉；以及修复
            「拉取模型」在密钥存于 auth.json 时拿不到密钥而失败、且探测请求没有超时导致
            一直转圈。

            ### 修复 Fixes

            - **修复保存自定义模型后，会话输入框的模型选择器点不动、像是没有模型配置**：
              桌面端为「避免 300 个模型的提供商淹没菜单」而维护了一份策展名单
              （`models-selection.json`）。当自定义提供商的模型 id 被改掉（改名、换模型）
              后，名单里的旧 id 一个都对不上，`filterAvailableModels` 会把这个提供商
              **新**的模型也一并过滤掉 —— 菜单被清空，看起来就像压根没配任何模型。文件里
              本就写好了 `pruneModelSelection`（注释即写着「so stale ids cannot hide a
              fresh list」），但生产代码从未调用；且它把过期名单裁剪成 `[]`，而 `[]` 在
              这套设计里恰恰是「隐藏该提供商」的意思，等于把「模型改名了」误判成「用户想
              隐藏」。现新增 `pruneStaleModelSelection` 区分两种空列表 —— 用户主动设的
              `[]`（保留，继续隐藏）与「原本有 id、裁剪后全没了」的过期名单（删掉整个键，
              恢复成显示全部），并在 Composer 过滤前先裁剪、结果回写，**自愈**且下次启动
              不会复活；机器上已有的残留数据打开一次会话即自动清除。

            - **修复自定义提供商「拉取模型」失败**：`models.discover` 与
              `models.testBaseUrl` 只认表单里填的 API Key，而「测试模型」
              （`testConnection`）会带 `providerId` 并回退到 `auth.json` 里的密钥。于是
              通过**设置 → 提供商**配好密钥的提供商（密钥只落在 auth.json，表单里读不到），
              会出现**测速成功、拉取 401** 的怪现象。现三个探测统一走 `resolveProbeKey`：
              表单 key 优先，回退 auth.json。注：rc.2 已修过拉取报 `Response is not JSON`
              （改走 Chromium 网络栈），本次是另一条独立路径。

            - **拉取模型 / 地址测速增加超时**：这两个请求此前完全没有超时（只有「测试模型」
              有 20 秒），端点挂住时按钮会一直转圈，看起来也像失败。现拉取 30 秒、
              测速 20 秒。

            - **Fixed the model picker being unusable after saving a custom model**: the
              desktop keeps its own curation list (`models-selection.json`) so a
              300-model provider cannot flood the menu. Once a custom provider's model
              ids are changed, none of the curated ids match any more, and
              `filterAvailableModels` filters away the provider's *new* models too —
              leaving the menu empty, which reads as "this session has no model config
              at all". `pruneModelSelection` already existed (its own comment says "so
              stale ids cannot hide a fresh list") but was never called in production,
              and it collapsed a stale curation to `[]`, which in this design means
              "hide this provider" — turning "the models were renamed" into "the user
              wanted it hidden". The new `pruneStaleModelSelection` tells the two
              apart: an explicit `[]` is kept, while a curation that *had* ids and lost
              them all is dropped so the provider shows again. The composer now prunes
              before filtering and writes the result back, self-healing existing
              leftover data on the next session.

            - **Fixed "Fetch models" failing**: `models.discover` and
              `models.testBaseUrl` only used the API key typed in the form, while "Test
              model" (`testConnection`) also passed `providerId` and fell back to the
              key in `auth.json`. A provider keyed through Settings → Providers stores
              its secret only in auth.json, so the form field came up empty and
              discovery got a 401 while the connection test passed. All three probes
              now share `resolveProbeKey` — form key first, auth.json as fallback.
              (rc.2 already fixed a different failure here, `Response is not JSON`, by
              moving to the Chromium network stack.)

            - **Fetch models and base-URL test now time out**: neither request had a
              deadline (only "Test model" did, at 20s), so a hung endpoint left the
              button spinning indefinitely. Discovery is now 30s and the base-URL probe
              20s.

            ### 优化 / 体验 Improvements

            - **模型列表刷新失败时不再清空已有列表**：Composer 的 `refreshModels` 原来在
              `catch` 里直接把列表置空，一次瞬时故障就变成一个点不开也恢复不了的死按钮；
              现在保留原列表并输出日志。

            - **The model list is no longer blanked on a failed refresh**:
              `refreshModels` used to empty the list in its `catch`, turning a
              transient failure into a model button that neither opens nor recovers.
              It now keeps the previous list and logs the error.

            ## 下载 / Downloads
            - **Windows x64**: `Pi Desktop-*-win-x64-setup.exe`
            - **Windows ARM64**: `Pi Desktop-*-win-arm64-setup.exe`
            - **macOS Apple Silicon**: `Pi Desktop-*-mac-arm64.dmg`
            - **macOS Intel**: `Pi Desktop-*-mac-x64.dmg`

          files: upload/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
