# Release packaging + GitHub Release: ONLY on push to main (or manual dispatch).
# Tags and `dev` must NOT trigger this workflow. Use ci.yml for PR/dev checks.
#
# One job = one OS/arch installer (never fat / multi-arch packages).
name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish GitHub Release artifacts"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  # Never cancel an in-flight release — previous runs were aborted mid macOS build
  # when a follow-up push to main arrived (cancel-in-progress: true).
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build (${{ matrix.name }})
    needs: check
    runs-on: ${{ matrix.os }}
    # Fail fast instead of sitting in a scarce-runner void for hours.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            dugite_arch: x64
            build_cmd: npm run dist:win:x64
            artifact_glob: release/*-setup.exe
          - name: windows-arm64
            # Separate job → separate NSIS (not a fat installer). Cross-arch Electron + node-pty prebuilds.
            os: windows-latest
            dugite_arch: arm64
            build_cmd: npm run dist:win:arm64
            artifact_glob: release/*-setup.exe
          - name: macos-arm64
            os: macos-latest
            dugite_arch: arm64
            build_cmd: npm run dist:mac:arm64
            artifact_glob: release/*.dmg
          - name: macos-x64
            # Intel DMG on Apple Silicon runners. Avoid macos-13 (scarce / long queue).
            # dist:mac:x64 rebuilds node-pty for x64 then packages with npmRebuild=false
            # (cross-arch electron-builder rebuild often SIGABRT / exit 134).
            os: macos-latest
            dugite_arch: x64
            build_cmd: npm run dist:mac:x64
            artifact_glob: release/*.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # dugite postinstall fetches host-arch Git; cross-arch jobs must refresh before pack.
      - name: Ensure dugite embedded Git (${{ matrix.dugite_arch }})
        run: node scripts/ensure-dugite-git.mjs ${{ matrix.dugite_arch }}

      - name: Generate icons
        run: npm run icons

      - name: Build & package
        env:
          # Prevent electron-builder from creating/updating GitHub Releases mid-build
          # (publish is handled solely by the softprops job below).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip Apple identity discovery — unsigned builds; avoids notarize/signing hangs.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Monaco / Vite can OOM-abort (exit 134) on macOS runners without a larger heap.
          NODE_OPTIONS: --max-old-space-size=8192
        run: ${{ matrix.build_cmd }} -- --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pi-desktop-${{ matrix.name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: [check, build]
    # Publish whatever arch artifacts succeeded (don't block the whole release on one matrix cell).
    if: >
      always() &&
      needs.check.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p upload
          find dist-artifacts -type f \( -name '*-setup.exe' -o -name '*.dmg' -o -name '*.AppImage' \) -print -exec cp {} upload/ \;
          echo "=== release assets ==="
          ls -lah upload || true
          count=$(find upload -type f | wc -l | tr -d ' ')
          if [ "$count" -lt 1 ]; then
            echo "No release assets found" >&2
            exit 1
          fi

      - name: Read version
        id: ver
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Pi Desktop ${{ steps.ver.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 主要更新（0.1.3 正式版）

            功能与稳定性小版本。会话继续共用 Pi CLI（`~/.pi/agent/sessions`），无独立会话库。

            ### 扩展与子 Agent
            - 修复桌面端扩展 / 子 Agent 启动 Pi 失败（Electron utilityProcess 下路径与 Windows 无 shell 启动问题）
            - 正确解析系统 Node、`cli.js`、PATH（含 pnpm）；打包 asar / macOS 使用 Electron-as-Node 兼容

            ### 聊天与工具卡片
            - 修复工具调用过程中助手「思考」气泡反复出现 / 重复提交
            - write / edit 等工具流式预览更稳定；连续 read 可折叠，write/edit/bash 保持独立卡片
            - 用户消息 sticky 区域更紧凑，减少遮挡

            ### `@` 文件引用
            - 模糊搜索：文件名、路径片段、驼峰缩写、多词（如 `comp vue`）
            - 空 `@` 优先展示最近打开的预览文件；列表同时显示文件名与所在目录
            - 预览中选中代码可一键加入聊天（含行号范围）

            ### 语音与快捷操作
            - 提问弹窗 / 扩展输入框支持语音写入，识别完成后自动回焦
            - 左侧工作区行、右侧聊天标题栏可快捷新建会话
            - 文件树右键可复制相对路径 / 绝对路径

            ## What's New (0.1.3 stable)

            Feature and stability patch. Sessions stay **shared with Pi CLI**.

            ### Extensions & sub-agents
            - Fixed Pi spawn failures for extensions / sub-agents under Electron utilityProcess (path resolution; Windows no-shell EINVAL)
            - Resolves system Node, `cli.js`, and PATH (incl. pnpm); asar / macOS Electron-as-Node compatible

            ### Chat & tool cards
            - Fixed duplicate assistant “thinking” bubbles during tool rounds
            - More reliable streaming previews for write/edit; consecutive reads collapse; write/edit/bash stay standalone
            - Tighter sticky user prompts

            ### `@` file mentions
            - Fuzzy search: basename, path fragments, camelCase acronyms, multi-token queries
            - Empty `@` prefers recently opened preview files; clearer name + directory labels
            - Select code in preview → add to chat (with line ranges)

            ### Voice & shortcuts
            - Voice input in Ask User / extension fields; focus restored after transcription
            - Quick new session from workspace row and chat header
            - File tree context menu: copy relative / absolute path

            ## 下载 / Downloads
            - **Windows x64**: `Pi Desktop-*-win-x64-setup.exe`
            - **Windows ARM64**: `Pi Desktop-*-win-arm64-setup.exe`
            - **macOS Apple Silicon**: `Pi Desktop-*-mac-arm64.dmg`
            - **macOS Intel**: `Pi Desktop-*-mac-x64.dmg`

            ## 说明 / Notes
            - 本版本为 **正式稳定版**（非 prerelease）
            - macOS 未公证：首次打开可能需要右键 → 打开
            - This is a **stable** release
            - macOS is unsigned/notarization off — first open may need right-click → Open
          files: upload/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
