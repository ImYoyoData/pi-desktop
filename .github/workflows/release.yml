# Release packaging + GitHub Release: ONLY on push to main (or manual dispatch).
# Tags and `dev` must NOT trigger this workflow. Use ci.yml for PR/dev checks.
#
# One job = one OS/arch installer (never fat / multi-arch packages).
name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish GitHub Release artifacts"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  # Never cancel an in-flight release — previous runs were aborted mid macOS build
  # when a follow-up push to main arrived (cancel-in-progress: true).
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build (${{ matrix.name }})
    needs: check
    runs-on: ${{ matrix.os }}
    # Fail fast instead of sitting in a scarce-runner void for hours.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            dugite_arch: x64
            build_cmd: npm run dist:win:x64
            artifact_glob: release/*-setup.exe
          - name: windows-arm64
            # Separate job → separate NSIS (not a fat installer). Cross-arch Electron + node-pty prebuilds.
            os: windows-latest
            dugite_arch: arm64
            build_cmd: npm run dist:win:arm64
            artifact_glob: release/*-setup.exe
          - name: macos-arm64
            os: macos-latest
            dugite_arch: arm64
            build_cmd: npm run dist:mac:arm64
            artifact_glob: release/*.dmg
          - name: macos-x64
            # Intel DMG on Apple Silicon runners. Avoid macos-13 (scarce / long queue).
            # dist:mac:x64 rebuilds node-pty for x64 then packages with npmRebuild=false
            # (cross-arch electron-builder rebuild often SIGABRT / exit 134).
            os: macos-latest
            dugite_arch: x64
            build_cmd: npm run dist:mac:x64
            artifact_glob: release/*.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # dugite postinstall fetches host-arch Git; cross-arch jobs must refresh before pack.
      - name: Ensure dugite embedded Git (${{ matrix.dugite_arch }})
        run: node scripts/ensure-dugite-git.mjs ${{ matrix.dugite_arch }}

      - name: Generate icons
        run: npm run icons

      - name: Build & package
        env:
          # Prevent electron-builder from creating/updating GitHub Releases mid-build
          # (publish is handled solely by the softprops job below).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip Apple identity discovery — unsigned builds; avoids notarize/signing hangs.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Monaco / Vite can OOM-abort (exit 134) on macOS runners without a larger heap.
          NODE_OPTIONS: --max-old-space-size=8192
        run: ${{ matrix.build_cmd }} -- --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pi-desktop-${{ matrix.name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: [check, build]
    # Publish whatever arch artifacts succeeded (don't block the whole release on one matrix cell).
    if: >
      always() &&
      needs.check.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p upload
          find dist-artifacts -type f \( -name '*-setup.exe' -o -name '*.dmg' -o -name '*.AppImage' \) -print -exec cp {} upload/ \;
          echo "=== release assets ==="
          ls -lah upload || true
          count=$(find upload -type f | wc -l | tr -d ' ')
          if [ "$count" -lt 1 ]; then
            echo "No release assets found" >&2
            exit 1
          fi

      - name: Read version
        id: ver
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Pi Desktop ${{ steps.ver.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |

            ## 主要更新（v0.3.4）

            本版重点：「局域网网页控制台」改名为**远程控制**并默认开启局域网访问（普通 HTTP，无证书警告）；公网访问改用 Cloudflare 隧道按需打开，**并支持绑定你自己的域名让地址固定不变**；网页版移除语音输入但补上浏览器原生朗读；修复 Windows 上 bash 工具不可用的问题。

            ### 新功能 Features
            - 「远程控制」取代原「局域网网页控制台」：标题栏入口、设置面板与网页端标题统一更名。
            - 局域网访问**默认开启**：启动即监听 http://本机IP:18700，同一局域网内手机/平板/电脑用浏览器直接可用。
            - 登录方式简化为 **9 位数字访问密码**：首次运行自动生成，面板内可查看、复制、一键更换，不再需要用户名密码。
            - 新增「公网访问」开关（默认关闭）：打开后由内置 cloudflared 建立 Cloudflare 隧道，生成 https 公网地址；TLS 由 Cloudflare 边缘终结，隧道只转发到 127.0.0.1 的本地端口，不影响局域网本地访问。
            - **支持绑定自己的域名**：填入 Cloudflare 隧道 Token + 公网地址后改用命名隧道，地址**固定不变**，重启也不用重新发链接（临时 trycloudflare 地址每次重启都会变）。面板内附「打开 Cloudflare 隧道页面」按钮与 Token 粘贴，不用自己找入口。
            - 网页版朗读改用**浏览器原生语音合成**（Web Speech API）：点消息朗读即可发声，零安装、零下载，不占用桌面端的语音模型。
            - 登录失败按来源限速：公网来源 6 次失败锁定 10 分钟，局域网来源独立计数，防止爆破。

            ### 变更 Changes
            - 局域网改为普通 HTTP：不再生成自签名证书，手机首次打开没有「证书不受信任」警告；代价是局域网内不加密，请只在可信的家庭/办公网络使用。公网地址仍为 HTTPS。
            - 隧道进程改由官方 `cloudflared` npm 包托管（二进制仍由应用自行校验/获取），删掉了手写的下载与解压逻辑。
            - 网页版移除录音/语音输入（麦克风按钮、PCM 采集、转写代理与桌面 ASR 调用），桌面端语音输入不受影响；朗读功能保留并改为浏览器实现。
            - **回复中发送的内容改为「引导」语义**：不再排队等下一轮，而是立即注入当前这轮，Pi 会在下一个 LLM 调用前看到它并据此继续推理（对应此前只能等本轮结束的行为）。
            - 移除 selfsigned 依赖；安装包不再打包开发目录（promo-video 等约 120MB），体积减半。

            ### 修复 Fixes
            - **修复 Windows 上 bash 工具完全不可用**（报错 execvpe(/bin/bash) failed: No such file or directory）：工具原本会退回到 PATH 上的 bash.exe，而那其实是 WSL 启动器，未安装 WSL 发行版时必然失败。现在会先找真正的 bash（Git Bash 等），找不到就改用内置的 PowerShell 工具，并禁止调用不可用的 bash，避免模型反复撞错。
            - 修复模型选择器在**新建会话（未发送任何消息）时就被锁死**：判断依据误用了会话摘要里的状态字段，该字段可能滞后残留；现在只依据当前真实的流式状态。
            - 修复回复期间发送的内容会从界面上"消失"：发送后立即显示为待发送卡片并保留到被处理，不再让人以为消息丢了。
            - 修复模型切换下拉框**无法滚动**：模型上百个时菜单会撑出窗口，下面的模型点不到；现在限制高度并内部滚动。
            - 修复公网访问「页面能打开、密码能登录，却一直显示已断开/正在连接」：隧道入口未挂载 WebSocket，公网 wss 请求被当成普通 HTTP 处理返回 404，导致页面登录后无法保持长连接。
            - 修复开启公网访问时看门狗在 cloudflared 下载途中误判「未在运行」并重试，导致下载被中断、二进制残缺；同时修正重试退避被重置成固定 5 秒的问题。
            - 修复打包版找不到内置 cloudflared：应用归档(asar)内的路径会被认为"存在"却无法执行，且打包会压平按架构分的目录，现已同时兼容两种布局并提前实跑验证二进制可用。
            - 修复侧栏偶尔多出一个「空白工作区」：空白路径被解析成应用自身的工作目录，变成一个没有名字的工作区条目。
            - 修复中英语言包中重复定义的文案键（构建时会告警，且会静默覆盖），并加上自动化校验防止再犯。

            ### 优化 / 体验 Improvements
            - 端口被占用、页面未构建等启动失败会在面板内说明原因，并在 20 秒后自动重试一次。
            - 面板新增公网地址状态（连接中/已就绪/失败原因与重试按钮），标题栏用颜色区分「仅局域网」与「已开公网」；短时间来回开关会保留同一地址。
            - 隧道访问使用 cloudflared 默认传输协议：实测强制 http2 反而会让临时地址不可达，故不强制。
            - 隧道状态变化与公网地址写入日志，便于排查。
            - 启动日志会打印本机实际使用的命令 shell，便于排查命令执行问题。

            ## What's New (v0.3.4)

            The LAN web console is now **Remote Control** with LAN access on by default (plain HTTP, no certificate warning); public access is an opt-in Cloudflare tunnel that can also serve **your own fixed domain**; the web console lost voice input but gained browser-native read-aloud. This release also fixes the broken bash tool on Windows.

            ### Features
            - Renamed the LAN web console to **Remote Control** across the titlebar entry, settings panel and web page title.
            - **LAN access is on by default**: the panel listens on http://your-pc-ip:18700 so a phone, tablet or PC on the same network works out of the box.
            - Login is a single **9-digit access PIN**, auto-generated on first run and viewable, copyable and rotatable in the panel — no username/password needed.
            - New **Public access** switch (off by default): the bundled cloudflared opens a Cloudflare tunnel and publishes an https URL. TLS terminates at Cloudflare's edge and the tunnel only ever forwards to a loopback port, so local LAN access is unaffected.
            - **Bring your own domain**: enter a Cloudflare tunnel token plus your public hostname to switch to a named tunnel whose address never changes, so nothing has to be re-shared after a restart (the temporary trycloudflare address changes every restart). The panel includes a shortcut to the Cloudflare tunnels page and a token paste button.
            - **Read-aloud in the web console now uses the browser's own speech synthesis** (Web Speech API): tap speak on a message and it talks, with nothing to install or download and no desktop voice model involved.
            - Failed logins are rate limited per client — 6 attempts then a 10-minute lock, counted separately for tunnel traffic.

            ### Changes
            - The LAN side now uses plain HTTP: no self-signed certificate and no certificate warning on phones. The trade-off is unencrypted LAN traffic, so use it on a trusted home/office network; the public URL is still HTTPS.
            - The tunnel process is now driven by the official `cloudflared` npm package (the app still verifies and obtains the binary itself), replacing hand-written download/unpack logic.
            - Removed voice recording from the web console (mic button, PCM capture, transcription proxy and the desktop ASR call); desktop voice input is unchanged and read-aloud is kept via the browser.
            - Messages sent **while Pi is replying** are now delivered as guidance into the running turn (Pi sees them before its next LLM call) instead of being queued for the following turn.
            - Dropped the selfsigned dependency, and development folders (promo-video and friends, ~120MB) are no longer packaged — the installer is about half the size.

            ### Fixes
            - **Fixed the bash tool being unusable on Windows** ("execvpe(/bin/bash) failed: No such file or directory"): its shell fallback picked `bash.exe` from PATH, which is the WSL launcher and fails whenever no WSL distribution is installed. The app now looks for a real bash (Git Bash and friends) first, and otherwise switches to the built-in PowerShell tool while denying the broken `bash` tool so the model cannot keep hitting the error.
            - Fixed the model picker being locked in a **brand-new session that had sent nothing**: it trusted a session-summary status field that can lag behind; it now follows the live streaming state only.
            - Fixed a message sent during a reply appearing to vanish from the UI: it now shows as a pending card until the agent takes it.
            - Fixed the model switcher dropdown **not scrolling**: with hundreds of models the menu grew past the window and the lower models were unclickable; it is now height-capped and scrolls internally.
            - Fixed public access getting stuck on "disconnected / reconnecting" after a successful login: the tunnel origin listener had no WebSocket server attached, so a wss request was answered by the plain HTTP handler with 404 and the public page could never hold a connection.
            - Fixed the watchdog declaring cloudflared "not running" while it was still downloading, which aborted the download and left a broken binary; retry backoff no longer collapses into a fixed 5-second loop.
            - Fixed packaged builds failing to find the bundled cloudflared: paths inside the app archive report as existing but cannot be executed, and packaging flattens the per-arch directory — both layouts are now handled and the binary is actually executed to verify it before use.
            - Fixed the sidebar occasionally showing an extra blank workspace: a blank path resolved to the app's own working directory and rendered as a nameless workspace entry.
            - Fixed duplicated message keys in the locale files (a build warning, and the duplicate silently overrode the original) and added automated checks so it cannot come back.

            ### Improvements
            - Startup failures (busy port, missing build) now explain themselves in the panel and retry once after 20 seconds.
            - The panel shows the public URL state (connecting / ready / error with retry); the titlebar dot distinguishes LAN-only from public, and toggling off/on quickly keeps the same address.
            - Tunnel traffic uses cloudflared's default transport: forcing http2 was measured to make the temporary address unreachable, so it is not forced.
            - Tunnel transitions and the public URL are logged for diagnosis.
            - The startup log now prints which command shell was chosen, making shell problems diagnosable.

            ## 下载 / Downloads
            - **Windows x64**: `Pi Desktop-*-win-x64-setup.exe`
            - **Windows ARM64**: `Pi Desktop-*-win-arm64-setup.exe`
            - **macOS Apple Silicon**: `Pi Desktop-*-mac-arm64.dmg`
            - **macOS Intel**: `Pi Desktop-*-mac-x64.dmg`

            ## 说明 / Notes
            - 本版本为**正式稳定版**（非 prerelease）
            - 远程控制默认开启局域网访问，可在标题栏「远程控制」面板中关闭
            - 需要固定公网地址时，请在面板中填入自己的 Cloudflare 隧道 Token 与域名
            - macOS 未公证：首次打开可能需要右键 → 打开
            - This is a **stable** release
            - Remote Control enables LAN access by default; turn it off from the Remote Control panel in the titlebar
            - For a fixed public address, add your own Cloudflare tunnel token and hostname in the panel
            - macOS is unsigned/notarization off — first open may need right-click — Open

          files: upload/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
