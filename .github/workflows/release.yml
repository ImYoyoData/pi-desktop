#file: noinspection UndefinedParamsPresent
# Release packaging + GitHub Release: ONLY on push to main (or manual dispatch).
# Tags and `dev` must NOT trigger this workflow. Use ci.yml for PR/dev checks.
#
# One job = one OS/arch installer (never fat / multi-arch packages).
name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish GitHub Release artifacts"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  # Never cancel an in-flight release — previous runs were aborted mid
  # macOS build when a follow-up push to main arrived
  # (cancel-in-progress: true).
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  version:
    name: Check version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.v.outputs.changed }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # 同一版本号只发布一次：tag 已存在就跳过整条发布链；手动 dispatch 时强制重发。
      - name: Detect version tag
        id: v
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REF="repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG"
          if STATUS=$(gh api "$REF" 2>&1 >/dev/null); then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [[ "$STATUS" == *"HTTP 404"* ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag lookup failed: $STATUS" >&2
            exit 1
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: [check, version]
    if: needs.version.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    # Fail fast instead of sitting in a scarce-runner void for hours.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            dugite_arch: x64
            build_cmd: npm run dist:win:x64
            artifact_glob: release/*-setup.exe
          - name: windows-arm64
            # Separate job → separate NSIS (not a fat installer).
            # Cross-arch Electron + node-pty prebuilds.
            os: windows-latest
            dugite_arch: arm64
            build_cmd: npm run dist:win:arm64
            artifact_glob: release/*-setup.exe
          - name: macos-arm64
            os: macos-latest
            dugite_arch: arm64
            build_cmd: npm run dist:mac:arm64
            artifact_glob: release/*.dmg
          - name: macos-x64
            # Intel DMG on Apple Silicon runners. Avoid macos-13
            # (scarce / long queue).
            # dist:mac:x64 rebuilds node-pty for x64 then packages with
            # npmRebuild=false
            # (cross-arch electron-builder rebuild often SIGABRT / exit 134).
            os: macos-latest
            dugite_arch: x64
            build_cmd: npm run dist:mac:x64
            artifact_glob: release/*.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # dugite post install fetches host-arch Git; cross-arch jobs must
      # refresh before pack.
      - name: Ensure dugite embedded Git (${{ matrix.dugite_arch }})
        run: node scripts/ensure-dugite-git.mjs ${{ matrix.dugite_arch }}

      - name: Generate icons
        run: npm run icons

      - name: Build & package
        env:
          # Prevent electron-builder from creating/updating GitHub
          # Releases mid-build (publish is handled solely by the softprops
          # job below).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip Apple identity discovery — unsigned builds; avoids
          # notarize/signing hangs.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Monaco / Vite can OOM-abort (exit 134) on macOS runners
          # without a larger heap.
          NODE_OPTIONS: --max-old-space-size=8192
        # --publish never 由各 dist 脚本自带；此处追加 `-- --publish never` 会被 npm
        # 附到脚本末尾，落到嵌套的 npm run 上并作为未知 CLI 配置直接报错。
        run: ${{ matrix.build_cmd }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pi-desktop-${{ matrix.name }}
          path: |
            ${{ matrix.artifact_glob }}
            release/latest*.yml
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: [check, version, build]
    # Publish whatever arch artifacts succeeded (don't block the whole
    # release on one matrix cell).
    if: >
      always() &&
      needs.check.result == 'success' &&
      needs.version.outputs.changed == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p upload
          find dist-artifacts -type f \
            \( -name '*-setup.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name 'latest*.yml' \) \
            -print -exec cp {} upload/ \;
          echo "=== release assets ==="
          ls -lah upload || true
          count=$(find upload -type f | wc -l | tr -d ' ')
          if [ "$count" -lt 1 ]; then
            echo "No release assets found" >&2
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Pi Desktop ${{ needs.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |

            ## 主要更新（v0.3.6-rc.1）

            本版重点：跟进 pi 1.1.0（含 1.0.1–1.0.4）的全部变更，升级 SDK，
            适配 azure 更名、工具耗时记录、取消态与 MCP 客户端注册方式，并在
            界面上接入采样参数、MCP 项目覆盖、内置工具与提示模板管理，终端改用
            pi 原生运行状态；并修复退出后进程残留。

            ### 新功能 Features

            - **模型可编辑采样参数**：自定义模型编辑表单新增「采样参数」折叠区，
              直接编辑 `samplingParams`（如 `temperature`、`top_p`）与
              `samplingParamsByThinkingLevel`（按 off/minimal/low/medium/high/
              xhigh/max 分档覆盖），对应 pi 1.0.2 的按思考档采样设置（仅
              openai-completions / openai-responses / azure 生效）。
            - **MCP 服务器支持项目覆盖**：设置 → MCP 的用户级服务器新增「此项目」
              三态选择（跟随全局 / 在此项目启用 / 在此项目禁用），写入
              `<工作区>/.pi/mcp.json` 的覆盖条目（无 command/url，只改启用态），
              对应 pi 1.0.1 的项目级覆盖。
            - **工具页覆盖全部内置工具**：内置工具开关从 codemode / tool_search
              扩展到 pi 全部可切换工具（read / bash / powershell / edit / write /
              grep / find / ls / codemode / tool_search）。
            - **MCP 支持按工具暴露**：MCP 服务器编辑新增「按工具暴露（toolExposure）」，
              按工具名或通配符覆盖服务器的 exposure（codemode / deferred / direct /
              hidden），hidden 服务器也能只放行个别工具。
            - **思考档与模型设置**：「运行」设置新增「思考档与模型」节：默认启动
              思考档（defaultThinkingLevel）、按模型启动思考档（modelThinkingLevels）、
              启用模型循环列表（enabledModels 模式）、隐藏思考块开关（hideThinkingBlock）。
            - **消息投递方式**：新增「消息投递」节，引导与追问队列可选全部投递或
              逐条投递（steeringMode / followUpMode）。
            - **传输方式与 npm 命令**：环境节新增 provider 传输方式（transport：
              auto / sse / websocket / websocket-cached）与 npm 命令（npmCommand）设置。
            - **提示模板管理页**：设置页恢复「提示模板」分组（与智能体/技能同级），
              列出用户级 `~/.pi/agent/prompts/` 与工作区 `.pi/prompts/` 的模板，
              支持新建、编辑、启停与删除。
            - **终端改用 pi 原生运行状态**：终端面板解析 pi 上报的 OSC 7501
              （Program Status Protocol），tab 标签显示运行状态点（运行中呼吸点 /
              等待输入 / 已完成 / 出错），tooltip 带会话名或错误首行。
            - **内置扩展补齐 llama.cpp**：设置 → 工具的「内置扩展」现在列出 pi 全部
              四个内置扩展（llama.cpp / codemode / tool-search / mcp）。

            - **Editable sampling params for custom models**: the model
              editor gains a collapsible "Sampling params" section for
              `samplingParams` and `samplingParamsByThinkingLevel` (per
              off/minimal/low/medium/high/xhigh/max level), following pi
              1.0.2's sampling-by-thinking-level support (openai-completions
              / openai-responses / azure only).
            - **MCP project overrides**: user-level MCP servers gain an
              "In this project" selector (follow global / enable in this
              project / disable in this project) writing an override entry
              into `<workspace>/.pi/mcp.json`, following pi 1.0.1's project
              overrides.
            - **Built-in tool switches cover every tool**: the tool page
              now toggles all switchable pi tools (read / bash / powershell
              / edit / write / grep / find / ls / codemode / tool_search).
            - **Per-tool MCP exposure**: MCP server editing gains
              "Per-tool exposure (toolExposure)" to override the server
              exposure per tool name or wildcard (codemode / deferred /
              direct / hidden).
            - **Thinking level and model settings**: the Runtime page
              gains a "Thinking level and models" section — default
              thinking level, per-model thinking level, enabled model
              patterns, and a hide-thinking-blocks switch.
            - **Message delivery**: a new "Message delivery" section
              chooses whether queued steering and follow-ups are delivered
              all at once or one at a time.
            - **Transport and npm command**: the Environment section
              gains provider transport (auto / sse / websocket /
              websocket-cached) and npm command settings.
            - **Prompt templates page**: Settings restores the "Prompt
              templates" group, listing user (`~/.pi/agent/prompts/`) and
              workspace (`.pi/prompts/`) templates with create, edit,
              enable/disable and delete.
            - **Terminals use pi's native run status**: the terminal
              parses pi's OSC 7501 (Program Status Protocol) reports,
              showing a status dot on the tab (working / waiting / done /
              error).
            - **Built-in extensions list completed with llama.cpp**:
              Settings → Tools now lists all four of pi's built-in
              extensions (llama.cpp / codemode / tool-search / mcp).

            ### 变更 Changes

            - **接入官方预览包 pi-durable**：新增依赖 `@earendil-works/pi-durable`
              1.1.0（官方 durable 会话/任务/文档运行时，Experimental）。本轮仅打通
              依赖与类型/构建，行为不变。
            - **升级 pi 到 1.1.0**：`@earendil-works/pi-coding-agent`、
              `@earendil-works/pi-agent-core`、`@earendil-works/pi-ai` 从 1.0.0 升到
              1.1.0（pi-codemode / pi-mcp / pi-tui / pi-telemetry 同步）。
            - **azure provider 更名自动迁移**（pi 1.0.3 破坏性变更）：pi 把
              `azure-openai-responses` 更名为 `azure`。启动时自动把 `auth.json`、
              `models.json`、`settings.json`、`mcp.json` 里的旧 id 改名为新 id，
              Azure 凭据与设置不用手动搬。
            - **工具耗时改用 pi 记录的执行时间**（pi 1.1.0）：工具卡片优先显示 pi
              记录的执行耗时，历史会话也能还原每个工具的实际耗时。
            - **取消与自然完成可区分**（pi 1.1.0）：`agent_settled` 事件现在带
              `aborted`。取消落在工具执行中、没留下任何回答时，补一张「已取消」卡。
            - **MCP OAuth 支持客户端注册方式**（pi 1.0.1）：可选动态注册（DCR，默认）
              或客户端 ID 元数据文档（CIMD，`oauth.clientRegistration: "cimd"`）。
            - **依赖全面更新**：@types/node 26.6.5、electron 44.7.0、marked 18.1.0、
              mermaid 12.1.0、monaco-editor 0.57.0、vite 7.3.7、vitest 5.0.3
              等 18 项。受上游 peer 约束暂不升级：vite 8、TypeScript 7、
              katex 0.19。

            - **Upgraded pi to 1.1.0**: `@earendil-works/pi-coding-agent`,
              `@earendil-works/pi-agent-core` and
              `@earendil-works/pi-ai` moved from 1.0.0 to 1.1.0
              (pi-codemode / pi-mcp / pi-tui / pi-telemetry follow).
            - **Automatic migration for the azure provider rename**
              (pi 1.0.3 breaking change): pi renamed
              `azure-openai-responses` to `azure`. On launch the old id is
              rewritten to the new one in `auth.json`, `models.json`,
              `settings.json` and `mcp.json`.
            - **Tool durations now come from pi's recorded execution time**
              (pi 1.1.0): tool cards prefer pi's recorded duration, and history
              restores the real duration of every tool.
            - **Cancelled runs are told apart from finished ones** (pi 1.1.0):
              `agent_settled` now carries `aborted`.
            - **MCP OAuth client registration mode** (pi 1.0.1): dynamic
              registration (DCR, default) or Client ID Metadata Document (CIMD,
              `oauth.clientRegistration: "cimd"`).
            - **Dependencies refreshed**: @types/node 26.6.5, electron 44.7.0,
              marked 18.1.0, mermaid 12.1.0, monaco-editor 0.57.0, vite 7.3.7,
              vitest 5.0.3 and more. Held back by upstream peer constraints:
              vite 8, TypeScript 7, katex 0.19.

            ### 修复 Fixes

            - **修复退出后进程残留**：退出前未回收 node-pty 终端，ConPTY 管道句柄
              与 shell 子进程（pwsh / conhost）卡住主进程退出，窗口关掉后 electron
              主进程经常残留。现在退出时统一回收全部 pty，关闭窗口后进程树完整退出。
            - **修复 models.json 文本报错不友好**：粘贴非法 JSON 时现在报
              `Invalid models.json: …`，而不是裸的解析器异常。
            - **修复功能裁剪遗留的问题**：恢复被清理误删的四个 i18n 键与 preload 的
              `contributors.avatar`、修复 Composer 模板缺少的闭合标签（此前会中断
              构建）、移除未使用的 NModal 导入。

            - **Fixed processes left behind after quit**: node-pty
              terminals were never reclaimed on quit, so ConPTY pipe
              handles and shell children (pwsh / conhost) stalled the main
              process and electron.exe often lingered after the window
              closed. All ptys are now disposed on quit.
            - **Friendlier models.json parse errors**: pasting invalid
              JSON now reports `Invalid models.json: …` instead of a raw
              parser error.
            - **Fixed issues left by the feature removal**: restored the
              four i18n keys accidentally deleted during cleanup and the
              preload `contributors.avatar`, fixed the Composer template's
              missing closing tag (which had broken the build), and dropped
              the unused NModal import.

            ## 下载 / Downloads
            - **Windows x64**: `Pi-Desktop-*-win-x64-setup.exe`
            - **Windows ARM64**: `Pi-Desktop-*-win-arm64-setup.exe`
            - **macOS Apple Silicon**: `Pi-Desktop-*-mac-arm64.dmg`
            - **macOS Intel**: `Pi-Desktop-*-mac-x64.dmg`

          files: upload/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
