# Release packaging + GitHub Release: ONLY on push to main (or manual dispatch).
# Tags and `dev` must NOT trigger this workflow. Use ci.yml for PR/dev checks.
#
# One job = one OS/arch installer (never fat / multi-arch packages).
name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish GitHub Release artifacts"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  # Never cancel an in-flight release — previous runs were aborted mid macOS build
  # when a follow-up push to main arrived (cancel-in-progress: true).
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build (${{ matrix.name }})
    needs: check
    runs-on: ${{ matrix.os }}
    # Fail fast instead of sitting in a scarce-runner void for hours.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            dugite_arch: x64
            build_cmd: npm run dist:win:x64
            artifact_glob: release/*-setup.exe
          - name: windows-arm64
            # Separate job → separate NSIS (not a fat installer). Cross-arch Electron + node-pty prebuilds.
            os: windows-latest
            dugite_arch: arm64
            build_cmd: npm run dist:win:arm64
            artifact_glob: release/*-setup.exe
          - name: macos-arm64
            os: macos-latest
            dugite_arch: arm64
            build_cmd: npm run dist:mac:arm64
            artifact_glob: release/*.dmg
          - name: macos-x64
            # Intel DMG on Apple Silicon runners. Avoid macos-13 (scarce / long queue).
            # dist:mac:x64 rebuilds node-pty for x64 then packages with npmRebuild=false
            # (cross-arch electron-builder rebuild often SIGABRT / exit 134).
            os: macos-latest
            dugite_arch: x64
            build_cmd: npm run dist:mac:x64
            artifact_glob: release/*.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # dugite postinstall fetches host-arch Git; cross-arch jobs must refresh before pack.
      - name: Ensure dugite embedded Git (${{ matrix.dugite_arch }})
        run: node scripts/ensure-dugite-git.mjs ${{ matrix.dugite_arch }}

      - name: Generate icons
        run: npm run icons

      - name: Build & package
        env:
          # Prevent electron-builder from creating/updating GitHub Releases mid-build
          # (publish is handled solely by the softprops job below).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip Apple identity discovery — unsigned builds; avoids notarize/signing hangs.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Monaco / Vite can OOM-abort (exit 134) on macOS runners without a larger heap.
          NODE_OPTIONS: --max-old-space-size=8192
        run: ${{ matrix.build_cmd }} -- --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pi-desktop-${{ matrix.name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: [check, build]
    # Publish whatever arch artifacts succeeded (don't block the whole release on one matrix cell).
    if: >
      always() &&
      needs.check.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p upload
          find dist-artifacts -type f \( -name '*-setup.exe' -o -name '*.dmg' -o -name '*.AppImage' \) -print -exec cp {} upload/ \;
          echo "=== release assets ==="
          ls -lah upload || true
          count=$(find upload -type f | wc -l | tr -d ' ')
          if [ "$count" -lt 1 ]; then
            echo "No release assets found" >&2
            exit 1
          fi

      - name: Read version
        id: ver
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Pi Desktop ${{ steps.ver.outputs.tag }}
          draft: false
          prerelease: true
          generate_release_notes: true
          body: |
            ## 主要更新（0.0.21 测试版）
            - **写入/编辑工具**：执行中自动展开，并实时预览 diff
            - **Bash 后台**：启发式识别长任务；支持 `# pi-desktop:background`；Win11 用 PowerShell CIM 查子进程
            - **Running 面板**：输出更实时（合并 IPC + 选中刷新）
            - **TTS**：边合成边播放（分句流水线）
            - **删除确认**：对话框 loading，失败不关窗
            - **文件预览**：删除后保留编辑器缓存，顶部提示
            - **其它**：亮色终端 ANSI 白色可读性；ask_user 更紧凑；安全设置 IPC 纯对象 clone；录音条图标尺寸微调

            ## What's New (0.0.21 prerelease)
            - **Write/edit tools**: auto-expand while running with live diff preview
            - **Background bash**: heuristics + `# pi-desktop:background`; Win11 CIM child-process lookup
            - **Running tab**: snappier live output
            - **TTS**: chunked synthesize-and-play pipeline
            - **Delete dialogs**: loading state; keep open on failure
            - **Preview**: keep editor cache after file delete with a top notice
            - **Also**: light-theme terminal ANSI white; compact ask_user; security settings IPC clone; voice bar icon sizing

            ## 下载（每个系统/架构单独安装包）
            - **Windows x64**: `Pi Desktop-*-win-x64-setup.exe`
            - **Windows ARM64**: `Pi Desktop-*-win-arm64-setup.exe`
            - **macOS Apple Silicon**: `Pi Desktop-*-mac-arm64.dmg`
            - **macOS Intel**: `Pi Desktop-*-mac-x64.dmg`

            仅分架构独立包，无 universal / fat 安装包。

            ## Downloads (one installer per OS / arch)
            - **Windows x64**: `Pi Desktop-*-win-x64-setup.exe`
            - **Windows ARM64**: `Pi Desktop-*-win-arm64-setup.exe`
            - **macOS Apple Silicon**: `Pi Desktop-*-mac-arm64.dmg`
            - **macOS Intel**: `Pi Desktop-*-mac-x64.dmg`

            Separate packages only — no universal / fat installer.

            ## 说明 / Notes
            - 本版本为 **prerelease 测试版**
            - macOS 未公证：首次打开可能需要右键 → 打开
            - This is a **prerelease** test build
            - macOS is unsigned/notarization off — first open may need right-click → Open
          files: upload/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
