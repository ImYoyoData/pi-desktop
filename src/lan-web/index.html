<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pi Desktop Pi Desktop 局域网网页控制台</title>
<style>
  :root { --bg:#f6f7f9; --bg2:#fff; --fg:#1f2328; --muted:#6b7280; --border:#e5e7eb; --accent:#2563eb; --user:#eef2ff; --code:#0f172a; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif; background:var(--bg); color:var(--fg); display:flex; flex-direction:column; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111417; --bg2:#191c20; --fg:#e6edf3; --muted:#8b949e; --border:#2a2f36; --accent:#3b82f6; --user:#1c2440; --code:#0b0f14; }
  }
  header { display:flex; align-items:center; gap:10px; height:48px; padding:0 12px; background:var(--bg2); border-bottom:1px solid var(--border); flex-shrink:0; }
  #btnMenu { display:none; font-size:18px; border:none; background:none; color:var(--fg); cursor:pointer; }
  #title { font-weight:650; font-size:15px; }
  #status { margin-left:auto; font-size:12px; color:var(--muted); }
  #status.ok { color:#16a34a; }
  #status.err { color:#dc2626; }
  #wrap { flex:1; display:flex; min-height:0; }
  #side { width:260px; background:var(--bg2); border-right:1px solid var(--border); overflow-y:auto; flex-shrink:0; padding:10px; }
  #side h3 { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin:14px 4px 6px; }
  #side h3:first-child { margin-top:4px; }
  #side ul { list-style:none; margin:0; padding:0; }
  #side li { padding:8px 10px; border-radius:8px; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:6px; overflow:hidden; }
  #side li:hover { background:var(--border); }
  #side li.on { background:var(--accent); color:#fff; }
  #side li .dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  #side li .txt { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dot-idle { background:#9ca3af; }
  .dot-running { background:#22c55e; }
  .dot-error { background:#dc2626; }
  main { flex:1; display:flex; flex-direction:column; min-width:0; }
  #chat { flex:1; overflow-y:auto; padding:14px; max-width:860px; width:100%; margin:0 auto; }
  .msg { margin-bottom:12px; max-width:82%; }
  .msg.user { margin-left:auto; }
  .bubble { padding:9px 12px; border-radius:12px; background:var(--bg2); border:1px solid var(--border); font-size:14px; line-height:1.55; word-break:break-word; white-space:pre-wrap; }
  .msg.user .bubble { background:var(--user); border-color:transparent; }
  .msg.tool .bubble { padding:5px 10px; font-size:12px; color:var(--muted); background:transparent; border-color:transparent; }
  .msg.error .bubble { border-color:#dc2626; color:#dc2626; }
  .bubble pre { background:var(--code); color:#e6edf3; padding:8px 10px; border-radius:8px; overflow-x:auto; font-size:12.5px; margin:6px 0 0; }
  .bubble code.inline { background:var(--border); padding:1px 5px; border-radius:4px; font-size:12.5px; }
  .who { font-size:11px; color:var(--muted); margin-bottom:3px; padding:0 2px; }
  .msg.user .who { text-align:right; }
  #composer { border-top:1px solid var(--border); background:var(--bg2); padding:10px 12px; display:flex; gap:8px; align-items:center; max-width:860px; width:100%; margin:0 auto; }
  #input { flex:1; min-width:0; padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--fg); font-size:14px; outline:none; }
  #input:focus { border-color:var(--accent); }
  button { border:none; border-radius:10px; padding:10px 16px; font-size:14px; cursor:pointer; background:var(--accent); color:#fff; flex-shrink:0; }
  #btnVoice { background:var(--border); color:var(--fg); font-size:16px; padding:10px 12px; }
  #btnVoice.rec { background:#dc2626; color:#fff; animation:pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.55; } }
  #toast { position:fixed; left:50%; bottom:76px; transform:translateX(-50%); background:#111; color:#fff; padding:8px 14px; border-radius:8px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:10; max-width:90vw; }
  #toast.show { opacity:.95; }
  @media (max-width:720px) {
    #btnMenu { display:inline-flex; }
    #side { position:fixed; left:0; top:48px; bottom:0; z-index:5; transform:translateX(-100%); transition:transform .22s ease; width:78vw; max-width:300px; box-shadow:0 10px 30px rgba(0,0,0,.2); }
    #side.open { transform:translateX(0); }
    .msg { max-width:92%; }
  }
</style>
</head>
<body>
  <header>
    <button id="btnMenu" aria-label="菜单">&#9776;</button>
    <span id="title">Pi Desktop</span>
    <span id="status">连接中…</span>
  </header>
  <div id="wrap">
    <aside id="side">
      <h3>工作区</h3><ul id="wsList"></ul>
      <h3>会话</h3><ul id="sessionList"></ul>
    </aside>
    <main>
      <div id="chat"><div class="meta" style="text-align:center;margin-top:40px;color:var(--muted)">选择一个工作区和会话开始沟通</div></div>
      <div id="composer">
        <button id="btnVoice" title="按住录音识别">&#127908;</button>
        <input id="input" placeholder="输入消息，Enter 发送" autocomplete="off">
        <button id="btnSend">发送</button>
      </div>
    </main>
  </div>
  <div id="toast"></div>
<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const token = new URLSearchParams(location.search).get("token") || "";
  const wsProto = location.protocol === "https:" ? "wss" : "ws";
  let ws = null;
  let msgSeq = 0;
  let currentRoot = null;
  let currentSession = null;
  let currentFilePath = null;
  let reconnectTimer = null;
  let historyTimer = 0;
  const state = { workspaces: [], sessions: [] };

  function toast(text, ms) {
    const el = $("toast");
    el.textContent = text;
    el.classList.add("show");
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove("show"), ms || 2200);
  }
  function send(payload) {
    if (!ws || ws.readyState !== 1) { toast("未连接"); return; }
    payload.id = ++msgSeq;
    ws.send(JSON.stringify(payload));
  }
  function connect() {
    ws = new WebSocket(wsProto + "://" + location.host + "/ws");
    ws.onopen = () => { $("status").textContent = "已连接"; $("status").className = "ok"; send({ type: "hello", token: token }); };
    ws.onclose = () => { $("status").textContent = "已断开，重连中…"; $("status").className = "err"; clearTimeout(reconnectTimer); reconnectTimer = setTimeout(connect, 2000); };
    ws.onerror = () => { $("status").textContent = "连接错误"; $("status").className = "err"; };
    ws.onmessage = (ev) => { let m; try { m = JSON.parse(ev.data); } catch { return; } handle(m); };
  }
  function handle(msg) {
    switch (msg.type) {
      case "helloOk": send({ type: "listWorkspaces" }); break;
      case "error":
        toast(msg.message || "出错");
        if (/token/i.test(msg.message || "")) { $("status").textContent = "Token 无效"; $("status").className = "err"; }
        break;
      case "workspaces":
        state.workspaces = msg.recent || [];
        renderWorkspaces(msg.current);
        break;
      case "sessions":
        state.sessions = msg.sessions || [];
        renderSessions();
        break;
      case "sessionOpened":
        if (msg.session) { currentSession = msg.session.id; currentFilePath = msg.session.filePath || null; renderSessions(); loadHistory(); }
        break;
      case "history": renderHistory(msg.messages || []); break;
      case "transcript":
        $("input").value = ($("input").value ? $("input").value + " " : "") + (msg.text || "");
        $("input").focus();
        break;
      case "event": onAgentEvent(msg.event); break;
    }
  }
  function onAgentEvent(ev) {
    if (!ev || !currentSession) return;
    if (ev.sessionId && ev.sessionId !== currentSession) return;
    const t = ev.type || (ev.event && ev.event.type) || "";
    if (["prompt_done","prompt_error","agent_event","session_status","agent_start","agent_end","tool_execution_start","tool_execution_end","message_update","text_delta"].includes(t)) {
      clearTimeout(historyTimer);
      historyTimer = setTimeout(loadHistory, 350);
    }
    if (t === "prompt_error") toast("执行出错");
  }
  function loadHistory() { if (currentFilePath) send({ type: "getHistory", filePath: currentFilePath, limit: 60 }); }

  function renderWorkspaces(current) {
    const ul = $("wsList");
    ul.innerHTML = "";
    const roots = (state.workspaces || []).slice();
    if (current && !roots.includes(current)) roots.unshift(current);
    if (!roots.length) { ul.innerHTML = '<li style="color:var(--muted);cursor:default">暂无工作区</li>'; return; }
    for (const root of roots) {
      const li = document.createElement("li");
      li.className = root === current ? "on" : "";
      const name = root.replace(/[\\/]+$/, "").split(/[\\/]/).pop() || root;
      const txt = document.createElement("span");
      txt.className = "txt"; txt.textContent = name; txt.title = root;
      li.appendChild(txt);
      li.onclick = () => { currentRoot = root; renderWorkspaces(root); send({ type: "listSessions", root: root }); };
      ul.appendChild(li);
    }
    if (current && !currentRoot) { currentRoot = current; send({ type: "listSessions", root: current }); }
  }
  function renderSessions() {
    const ul = $("sessionList");
    ul.innerHTML = "";
    if (!state.sessions.length) { ul.innerHTML = '<li style="color:var(--muted);cursor:default">暂无会话</li>'; return; }
    for (const s of state.sessions) {
      const li = document.createElement("li");
      li.className = s.id === currentSession ? "on" : "";
      const dot = document.createElement("span");
      dot.className = "dot dot-" + (s.status || "idle");
      const txt = document.createElement("span");
      txt.className = "txt"; txt.textContent = s.name || s.firstMessage || s.id; txt.title = s.id;
      li.appendChild(dot); li.appendChild(txt);
      li.onclick = () => { if (!currentRoot) { toast("请先选择工作区"); return; } send({ type: "openSession", sessionId: s.id, root: currentRoot }); };
      ul.appendChild(li);
    }
  }
  function esc(s) { return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function renderMarkdown(text) {
    const parts = String(text || "").split(/```/);
    let out = "";
    for (let i = 0; i < parts.length; i++) {
      if (i % 2 === 1) out += "<pre>" + esc(parts[i].replace(/^[a-zA-Z0-9_+.-]+\n/, "")) + "</pre>";
      else out += esc(parts[i]).replace(/`([^`]+)`/g, '<code class="inline">$1</code>');
    }
    return out;
  }
  function renderHistory(messages) {
    const chat = $("chat");
    const frag = document.createDocumentFragment();
    for (const m of messages) {
      if (m.role === "user") {
        const div = document.createElement("div");
        div.className = "msg user";
        div.innerHTML = '<div class="who">你</div><div class="bubble">' + renderMarkdown(m.text) + "</div>";
        frag.appendChild(div);
      } else if (m.role === "assistant") {
        const div = document.createElement("div");
        div.className = "msg";
        div.innerHTML = '<div class="who">助手</div><div class="bubble">' + renderMarkdown(m.text || "") + "</div>";
        frag.appendChild(div);
      } else if (m.role === "tool") {
        const div = document.createElement("div");
        div.className = "msg tool";
        div.innerHTML = '<div class="bubble">&#128295; ' + esc(m.toolName || "tool") + (m.isError ? "（失败）" : "") + "</div>";
        frag.appendChild(div);
      } else if (m.role === "error") {
        const div = document.createElement("div");
        div.className = "msg error";
        div.innerHTML = '<div class="bubble">&#9888; ' + esc(m.text || "错误") + "</div>";
        frag.appendChild(div);
      }
    }
    chat.innerHTML = "";
    chat.appendChild(frag);
    chat.scrollTop = chat.scrollHeight;
  }

  function sendPrompt() {
    const input = $("input");
    const text = input.value.trim();
    if (!text || !currentSession) { if (!currentSession) toast("请先选择会话"); return; }
    send({ type: "sendPrompt", sessionId: currentSession, text: text });
    input.value = "";
  }
  $("btnSend").onclick = sendPrompt;
  $("input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendPrompt(); } });

  // ---------- voice ----------
  let audioCtx = null, workletNode = null, stream = null, chunks = [], inputRate = 48000, recording = false;
  const WORKLET = "class P extends AudioWorkletProcessor{process(i){const c=i[0]&&i[0][0];if(c&&c.length)this.port.postMessage(c.slice(0));return true}}registerProcessor('pi-lan-capture',P);";
  function linearDownsample(input, fromRate, toRate) {
    if (toRate >= fromRate) return input;
    const ratio = fromRate / toRate;
    const out = new Float32Array(Math.max(1, Math.floor(input.length / ratio)));
    for (let i = 0; i < out.length; i++) {
      const pos = i * ratio, idx = Math.floor(pos), frac = pos - idx;
      const a = input[idx] || 0, b = input[idx + 1] === undefined ? a : input[idx + 1];
      out[i] = a + (b - a) * frac;
    }
    return out;
  }
  function floatToInt16(input) {
    const out = new Int16Array(input.length);
    for (let i = 0; i < input.length; i++) {
      const v = Math.max(-1, Math.min(1, input[i]));
      out[i] = v < 0 ? Math.round(v * 0x8000) : Math.round(v * 0x7fff);
    }
    return out;
  }
  function pcmToBase64(pcm) {
    const bytes = new Uint8Array(pcm.buffer, pcm.byteOffset, pcm.byteLength);
    let bin = "";
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(bin);
  }
  async function startVoice() {
    if (!currentSession) { toast("请先选择会话"); return; }
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      await audioCtx.resume();
      await audioCtx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: "application/javascript" })));
      inputRate = audioCtx.sampleRate || 48000;
      const src = audioCtx.createMediaStreamSource(stream);
      workletNode = new AudioWorkletNode(audioCtx, "pi-lan-capture", { numberOfInputs: 1, numberOfOutputs: 1, channelCount: 1 });
      workletNode.port.onmessage = (ev) => { if (recording) chunks.push(ev.data); };
      src.connect(workletNode);
      workletNode.connect(audioCtx.destination);
      chunks = []; recording = true;
      $("btnVoice").classList.add("rec");
      toast("录音中… 再次点击结束并识别");
    } catch (err) { toast("无法录音：" + ((err && err.message) || err)); }
  }
  async function stopVoice() {
    recording = false;
    $("btnVoice").classList.remove("rec");
    try {
      if (workletNode) { workletNode.port.onmessage = null; workletNode.disconnect(); }
      if (stream) stream.getTracks().forEach((t) => t.stop());
      if (audioCtx) await audioCtx.close();
    } catch { /* ignore */ }
    workletNode = null; stream = null; audioCtx = null;
    if (!chunks.length) { toast("没有录到声音"); return; }
    let total = chunks.reduce((n, c) => n + c.length, 0);
    const merged = new Float32Array(total);
    let off = 0;
    for (const c of chunks) { merged.set(c, off); off += c.length; }
    const resampled = linearDownsample(merged, inputRate, 16000);
    const pcm = floatToInt16(resampled);
    toast("识别中…");
    send({ type: "transcribe", pcmBase64: pcmToBase64(pcm), sampleRate: 16000 });
    chunks = [];
  }
  $("btnVoice").onclick = () => { if (recording) void stopVoice(); else void startVoice(); };

  $("btnMenu").onclick = () => $("side").classList.toggle("open");
  document.addEventListener("click", (e) => {
    const side = $("side");
    if (window.innerWidth <= 720 && side.classList.contains("open") && !side.contains(e.target) && !e.target.closest("#btnMenu")) side.classList.remove("open");
  });

  connect();
})();
</script>
</body>
</html>
